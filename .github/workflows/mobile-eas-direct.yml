name: Tayar Mobile EAS Direct APK

on:
  workflow_dispatch:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/mobile-eas-direct.yml

permissions:
  contents: read

concurrency:
  group: tayar-mobile-eas-direct-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Verify EAS direct APK prerequisites
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is required."
            exit 1
          fi
          node - <<'NODE'
          const app = require('./app.json');
          const eas = require('./eas.json');
          const projectId = app.expo?.extra?.eas?.projectId;
          if (typeof projectId !== 'string' || !projectId.trim()) {
            throw new Error('expo.extra.eas.projectId is missing.');
          }
          const directEnv = eas.build?.direct?.env || {};
          const required = [
            'EXPO_PUBLIC_SUPABASE_URL',
            'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
          ];
          for (const key of required) {
            if (typeof directEnv[key] !== 'string' || !directEnv[key].trim()) {
              throw new Error(`${key} is missing from build.direct.env; refusing to queue a crash-prone APK.`);
            }
          }
          try {
            const url = new URL(directEnv.EXPO_PUBLIC_SUPABASE_URL);
            if (url.protocol !== 'https:') throw new Error('Supabase URL must use HTTPS.');
          } catch (error) {
            throw new Error(`EXPO_PUBLIC_SUPABASE_URL is invalid: ${error.message}`);
          }
          console.log(`Using EAS project ${projectId}.`);
          console.log('Required public mobile runtime configuration is present in the direct EAS profile.');
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare pinned mobile models
        run: npm run models:prepare

      - name: Verify Expo account and direct profile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@23.2.0 whoami
          npx --yes eas-cli@23.2.0 project:info
          npx --yes eas-cli@23.2.0 config --platform android --profile direct --json --non-interactive >/dev/null

      - name: Queue signed direct APK build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@23.2.0 build \
            --platform android \
            --profile direct \
            --non-interactive \
            --no-wait

  verify-apk:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: f45a7566-48ac-415b-a913-d09ba6ce435f
      SOURCE_COMMIT: 5c20f0d7bf9c225b45e4fbddcf70b15ffc41e801
      EXPECTED_VERSION_CODE: '4'
      APK_NAME: tayar-tools-v0.2.0-4.apk
    steps:
      - name: Checkout exact green candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install locked mobile dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch and validate exact EAS build
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@23.2.0 build:view "$BUILD_ID" --json > /tmp/eas-build.json
          node - <<'NODE'
          const fs = require('fs');
          const build = JSON.parse(fs.readFileSync('/tmp/eas-build.json', 'utf8'));
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          const failed = [];
          const expect = (ok, detail) => { if (!ok) failed.push(detail); };
          expect(build.id === process.env.BUILD_ID, `id=${build.id}`);
          expect(build.status === 'FINISHED', `status=${build.status}`);
          expect(build.platform === 'ANDROID', `platform=${build.platform}`);
          expect(build.distribution === 'INTERNAL', `distribution=${build.distribution}`);
          expect(build.buildProfile === 'direct', `buildProfile=${build.buildProfile}`);
          expect(build.appIdentifier === 'se.tayar.tools', `appIdentifier=${build.appIdentifier}`);
          expect(String(build.appBuildVersion) === process.env.EXPECTED_VERSION_CODE, `appBuildVersion=${build.appBuildVersion}`);
          expect(build.gitCommitHash === process.env.SOURCE_COMMIT, `gitCommitHash=${build.gitCommitHash}`);
          expect(typeof url === 'string' && url.length > 0, `artifact=${url}`);
          if (failed.length) throw new Error(`EAS build validation failed: ${failed.join(', ')}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `APK_URL=${url}\n`);
          console.log(`Validated EAS build ${build.id}: ${build.appIdentifier} ${build.appVersion} (${build.appBuildVersion})`);
          console.log(`Git commit: ${build.gitCommitHash}`);
          NODE

      - name: Download APK and compute SHA-256
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$APK_NAME" "$APK_URL"
          test -s "$APK_NAME"
          file "$APK_NAME"
          unzip -t "$APK_NAME" >/dev/null
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"

      - name: Verify Android signature and 16 KB ZIP alignment
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK_NAME"
          echo "APK signature and 16 KB ZIP alignment verified."

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayar-tools-android-direct-v0.2.0-4
          path: |
            apps/mobile/tayar-tools-v0.2.0-4.apk
            apps/mobile/tayar-tools-v0.2.0-4.apk.sha256
          if-no-files-found: error
          retention-days: 30
