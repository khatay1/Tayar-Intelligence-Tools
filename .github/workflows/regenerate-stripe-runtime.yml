name: Temporary Stripe Runtime Regeneration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/regenerate-stripe-runtime.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - run: npm ci
      - name: Regenerate affected runtime artifacts
        run: |
          node scripts/build-website-owned-application-runtime-template.mjs
          node scripts/build-application-release.mjs
          node scripts/build-website-byo-publish-function.mjs
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- server/generated/website-owned-application-runtime-template.ts supabase/functions/website-application-release/index.ts supabase/functions/website-byo-publish/index.ts; then
            echo "Generated artifacts already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/generated/website-owned-application-runtime-template.ts supabase/functions/website-application-release/index.ts supabase/functions/website-byo-publish/index.ts
          git commit -m "build: regenerate Stripe checkout runtime artifacts"
          git pull --rebase origin main
          git push origin HEAD:main
