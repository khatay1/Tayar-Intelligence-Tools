name: Account Deletion Edge Check

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/account-deletion-edge-check.yml'

permissions:
  contents: read

jobs:
  edge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Edge Function syntax smoke
        run: npm run smoke:edge-functions
      - name: Whitespace check
        run: git diff --check
