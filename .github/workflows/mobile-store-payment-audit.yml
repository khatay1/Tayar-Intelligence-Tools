name: Mobile Store Payment Audit

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/mobile-store-payment-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Find payment and upgrade surfaces
        shell: bash
        run: |
          grep -RInE 'billing-portal|checkout|stripe|purchase|subscribe|subscription|upgrade|pricing|payment' apps/mobile \
            --exclude='package-lock.json' --exclude='*.png' --exclude='*.b64' || true
