name: Mobile Store Policy Audit

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/mobile-store-policy-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit mobile purchase paths
        run: |
          echo '=== MOBILE PURCHASE / EXTERNAL BILLING REFERENCES ==='
          grep -RniE 'stripe|checkout|billing|upgrade|subscribe|subscription|purchase|paywall|portal' app components context lib --include='*.ts' --include='*.tsx' || true
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean
      - name: Generate merged release manifest
        run: cd android && ./gradlew :app:processReleaseMainManifest --no-daemon
      - name: Audit merged release permissions
        run: |
          echo '=== MERGED RELEASE PERMISSIONS ==='
          find android/app/build/intermediates -name AndroidManifest.xml -type f -print0 | xargs -0 grep -H 'uses-permission' || true
          echo '=== SENSITIVE RELEASE PERMISSION MATCHES ==='
          find android/app/build/intermediates -name AndroidManifest.xml -type f -print0 | xargs -0 grep -H -E 'SYSTEM_ALERT_WINDOW|CAMERA|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|READ_MEDIA_IMAGES|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|AD_ID' || true
          if find android/app/build/intermediates -name AndroidManifest.xml -type f -print0 | xargs -0 grep -q 'android.permission.SYSTEM_ALERT_WINDOW'; then
            echo 'SYSTEM_ALERT_WINDOW_PRESENT'
            exit 1
          fi
          echo 'SYSTEM_ALERT_WINDOW_ABSENT'
