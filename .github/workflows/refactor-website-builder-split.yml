name: Guarded Website Builder split

on:
  push:
    branches:
      - refactor/website-builder-split-20260916
    paths:
      - .github/workflows/refactor-website-builder-split.yml

permissions:
  contents: write

jobs:
  extract-ai-patch-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/website-builder-split-20260916
          fetch-depth: 0

      - name: Extract pure AI patch review model
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/modules/website-builder/WebsiteBuilderTool.tsx')
          module_path = Path('src/modules/website-builder/core/editor-ai-patch-review.ts')
          text = source_path.read_text(encoding='utf-8')

          start_marker = 'interface AIWebsitePageGeneration {'
          end_marker = 'interface AIEditScopeTarget {'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Refactor markers are not unique; refusing to modify source.')

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end].rstrip() + '\n'
          if len(block) < 8000:
              raise SystemExit(f'Extraction block unexpectedly small ({len(block)} bytes); refusing.')

          type_imports = [
              'Device', 'ElementAnimation', 'ElementShadow', 'SectionBackgroundMode',
              'SectionBackgroundPosition', 'SectionBackgroundSize', 'SectionContentWidth',
              'SectionLayout', 'SectionLayoutAlign', 'SectionType', 'WebsiteBrand',
              'WebsiteElementType', 'WebsiteFormFieldType', 'WebsiteSEO', 'WebsiteSection',
          ]
          module_header = (
              "import type { " + ', '.join(type_imports) + " } from './types';\n\n"
          )
          exported_block = re.sub(r'(?m)^(interface|type|function) ', r'export \1 ', block)
          module_text = module_header + exported_block

          type_names = [
              'AIWebsitePageGeneration', 'AIWebsiteGeneration', 'AIWebsitePatchChanges',
              'AIWebsitePatchOperation', 'AIQualityReview', 'AIWebsiteAgentPlanStep',
              'AIWebsiteAgentPlan', 'AIWebsitePlanReview', 'AIWebsitePatchReviewItem',
              'AIWebsitePatchReviewKind', 'AIWebsiteCanvasPreview', 'AIWebsitePatchReview',
          ]
          value_names = [
              'humanizeAIWebsitePatchAction', 'aiWebsitePatchReviewKind',
              'mergeAIWebsitePatchReviewKind', 'aiWebsitePatchPreviewClass',
              'describeAIWebsitePatchTarget', 'describeAIWebsitePatchFields',
          ]

          remainder = text[:start] + text[end:]
          used_types = [name for name in type_names if re.search(rf'\b{re.escape(name)}\b', remainder)]
          used_values = [name for name in value_names if re.search(rf'\b{re.escape(name)}\b', remainder)]
          if not used_types or not used_values:
              raise SystemExit('Expected extracted symbols are not referenced; refusing.')

          import_lines = ['import {']
          import_lines.extend(f'  {name},' for name in used_values)
          import_lines.extend(f'  type {name},' for name in used_types)
          import_lines.append("} from './core/editor-ai-patch-review';")
          import_text = '\n'.join(import_lines) + '\n'

          anchor = "import { applyEditorAIWorkingNativeOperations } from './core/editor-ai-working-project';\n"
          if remainder.count(anchor) != 1:
              raise SystemExit('Import anchor changed; refusing to modify source.')
          remainder = remainder.replace(anchor, anchor + import_text, 1)

          if start_marker in remainder:
              raise SystemExit('Extracted block still present after replacement.')
          if len(remainder) >= len(text) - 8000:
              raise SystemExit('WebsiteBuilderTool.tsx did not shrink enough; refusing.')

          module_path.write_text(module_text, encoding='utf-8')
          source_path.write_text(remainder, encoding='utf-8')

          print(f'WebsiteBuilderTool.tsx: {len(text)} -> {len(remainder)} bytes')
          print(f'Extracted module: {len(module_text)} bytes')
          print('Imported values:', ', '.join(used_values))
          print('Imported types:', ', '.join(used_types))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Website Builder smoke
        run: npm run smoke:website-builder

      - name: Commit verified extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/website-builder/WebsiteBuilderTool.tsx src/modules/website-builder/core/editor-ai-patch-review.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "[refactor-bot] Extract AI patch review model"
          git push origin HEAD:refactor/website-builder-split-20260916
