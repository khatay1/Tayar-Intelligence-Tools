name: Publish Tayar Direct Android APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Finished EAS direct APK build ID
        required: true
        default: a41d39ee-cef5-4a6f-8967-a836c8b3336d
        type: string
      app_version:
        description: Public app version
        required: true
        default: 0.2.0
        type: string
      build_number:
        description: Android versionCode/build number
        required: true
        default: '3'
        type: string
      source_commit:
        description: Git commit used by the EAS build
        required: true
        default: 30c50270e7b0e30173561f4aab94294a1fc9752b
        type: string

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_ID: ${{ inputs.build_id }}
      APP_VERSION: ${{ inputs.app_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact build source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install locked mobile dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund

      - name: Resolve and validate EAS APK artifact
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@23.2.0 build:view "$BUILD_ID" --json > /tmp/eas-build.json
          node - <<'NODE'
          const fs = require('fs');
          const build = JSON.parse(fs.readFileSync('/tmp/eas-build.json', 'utf8'));
          const expectedVersion = process.env.APP_VERSION;
          const expectedBuild = process.env.BUILD_NUMBER;
          const expectedCommit = process.env.SOURCE_COMMIT;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          const checks = [
            [build.status === 'FINISHED', `status=${build.status}`],
            [build.platform === 'ANDROID', `platform=${build.platform}`],
            [build.distribution === 'INTERNAL', `distribution=${build.distribution}`],
            [build.buildProfile === 'direct', `buildProfile=${build.buildProfile}`],
            [build.appIdentifier === 'se.tayar.tools', `appIdentifier=${build.appIdentifier}`],
            [build.appVersion === expectedVersion, `appVersion=${build.appVersion}`],
            [String(build.appBuildVersion) === String(expectedBuild), `appBuildVersion=${build.appBuildVersion}`],
            [build.gitCommitHash === expectedCommit, `gitCommitHash=${build.gitCommitHash}`],
            [typeof url === 'string' && url.includes('.apk'), `artifact=${url}`],
          ];
          const failed = checks.filter(([ok]) => !ok).map(([, detail]) => detail);
          if (failed.length) throw new Error(`EAS build validation failed: ${failed.join(', ')}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `APK_URL=${url}\n`);
          NODE

      - name: Download APK
        run: |
          set -euo pipefail
          FILE="tayar-tools-v${APP_VERSION}-${BUILD_NUMBER}.apk"
          curl --fail --location --retry 3 --output "$FILE" "$APK_URL"
          test -s "$FILE"
          unzip -t "$FILE" >/dev/null
          echo "APK_FILE=$FILE" >> "$GITHUB_ENV"
          sha256sum "$FILE" | tee "$FILE.sha256"

      - name: Verify Android signature and 16 KB ZIP alignment
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK_FILE"

      - name: Create immutable GitHub Release
        run: |
          set -euo pipefail
          TAG="android-v${APP_VERSION}-${BUILD_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite an immutable Android release."
            exit 1
          fi
          SHA256="$(cut -d' ' -f1 "$APK_FILE.sha256")"
          cat > /tmp/release-notes.md <<EOF
          Official signed Tayar Tools Android direct-install release.

          - App version: ${APP_VERSION}
          - Android build/versionCode: ${BUILD_NUMBER}
          - Package: se.tayar.tools
          - EAS build: ${BUILD_ID}
          - Source commit: ${SOURCE_COMMIT}
          - SHA-256: ${SHA256}

          Install only from tayar.se or this official GitHub release.
          EOF
          gh release create "$TAG" "$APK_FILE" "$APK_FILE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --title "Tayar Tools Android v${APP_VERSION} (${BUILD_NUMBER})" \
            --notes-file /tmp/release-notes.md
