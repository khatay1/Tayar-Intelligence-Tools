name: Guarded Website Builder model split

on:
  push:
    branches:
      - refactor/website-builder-split-20260916
    paths:
      - .github/workflows/refactor-website-builder-model.yml

permissions:
  contents: write

jobs:
  extract-builder-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/website-builder-split-20260916
          fetch-depth: 0

      - name: Extract project and UI data contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/modules/website-builder/WebsiteBuilderTool.tsx')
          module_path = Path('src/modules/website-builder/core/website-builder-model.ts')
          smoke_path = Path('scripts/website-builder-smoke.mjs')
          text = source_path.read_text(encoding='utf-8')

          start_marker = 'interface WebsitePage {'
          end_marker = "const REUSABLE_SECTIONS_KEY = 'tayar.website-builder.reusable-sections.v1';"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Website model markers are not unique; refusing.')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end].rstrip() + '\n'
          if not 6500 <= len(block) <= 24000:
              raise SystemExit(f'Website model block size unexpected ({len(block)} bytes); refusing.')

          required = [
              'interface WebsitePage {',
              'interface WebsiteTheme {',
              'interface WebsiteHeaderConfig {',
              'interface PersistedWebsiteProject {',
              'interface BillingState {',
              'interface ReusableSectionTemplate {',
              'function isWebsiteSymbol(',
          ]
          missing = [marker for marker in required if marker not in block]
          if missing:
              raise SystemExit(f'Expected model declarations missing: {missing}')

          header = (
              "import type { Language } from '@/context/PreferencesContext';\n"
              "import type { WebsiteBrand, WebsiteElement, WebsiteSEO, WebsiteSection } from './types';\n"
              "import type { WebsiteDeliveryConfig } from './delivery-config';\n"
              "import type { AIWebsitePatchReview } from './editor-ai-patch-review';\n"
              "import type { AIWebsiteAgentReview } from './editor-ai-scope';\n\n"
          )
          exported = re.sub(r'(?m)^(interface|type|function) ', r'export \1 ', block)
          module_text = header + exported

          declarations = re.findall(r'(?m)^(?:interface|type|function)\s+([A-Za-z0-9_]+)', block)
          function_names = set(re.findall(r'(?m)^function\s+([A-Za-z0-9_]+)', block))
          remainder = text[:start] + text[end:]
          used = [name for name in declarations if re.search(rf'\b{re.escape(name)}\b', remainder)]
          if len(used) < 12 or 'WebsitePage' not in used or 'WebsiteTheme' not in used:
              raise SystemExit(f'Unexpected remaining model references ({len(used)}): {used}')

          import_lines = ['import {']
          for name in used:
              import_lines.append(f"  {'' if name in function_names else 'type '}{name},")
          import_lines.append("} from './core/website-builder-model';")
          import_text = '\n'.join(import_lines) + '\n'

          anchor = "} from './core/editor-ai-review-targets';\n"
          if remainder.count(anchor) != 1:
              raise SystemExit('Review-target import anchor changed; refusing.')
          remainder = remainder.replace(anchor, anchor + import_text, 1)
          if start_marker in remainder:
              raise SystemExit('Website model block remained after extraction.')
          if len(remainder) >= len(text) - 6500:
              raise SystemExit('WebsiteBuilderTool.tsx did not shrink enough; refusing.')

          smoke = smoke_path.read_text(encoding='utf-8')
          path_anchor = "const editorAIReviewTargetsPath = resolve(root, 'src/modules/website-builder/core/editor-ai-review-targets.ts');\n"
          if smoke.count(path_anchor) != 1:
              raise SystemExit('Smoke review-target path anchor changed; refusing.')
          smoke = smoke.replace(
              path_anchor,
              path_anchor + "const websiteBuilderModelPath = resolve(root, 'src/modules/website-builder/core/website-builder-model.ts');\n",
              1,
          )

          existence_anchor = "  ['AI review target module exists', editorAIReviewTargetsPath],\n"
          if smoke.count(existence_anchor) != 1:
              raise SystemExit('Smoke review-target existence anchor changed; refusing.')
          smoke = smoke.replace(
              existence_anchor,
              existence_anchor + "  ['Website Builder model module exists', websiteBuilderModelPath],\n",
              1,
          )

          read_anchor = "const editorAIReviewTargets = existsSync(editorAIReviewTargetsPath) ? readFileSync(editorAIReviewTargetsPath, 'utf8') : '';\n"
          if smoke.count(read_anchor) != 1:
              raise SystemExit('Smoke review-target read anchor changed; refusing.')
          smoke = smoke.replace(
              read_anchor,
              read_anchor + "const websiteBuilderModel = existsSync(websiteBuilderModelPath) ? readFileSync(websiteBuilderModelPath, 'utf8') : '';\n",
              1,
          )

          composite_old = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}\\n${editorAIReviewTargets}`;\n"
          composite_new = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}\\n${editorAIReviewTargets}\\n${websiteBuilderModel}`;\n"
          if smoke.count(composite_old) != 1:
              raise SystemExit('Smoke composite source anchor changed; refusing.')
          smoke = smoke.replace(composite_old, composite_new, 1)

          source_path.write_text(remainder, encoding='utf-8')
          module_path.write_text(module_text, encoding='utf-8')
          smoke_path.write_text(smoke, encoding='utf-8')

          print(f'Website model extracted: {len(block)} bytes, {len(declarations)} declarations')
          print(f'WebsiteBuilderTool.tsx: {len(text)} -> {len(remainder)} bytes')
          print('Re-imported:', ', '.join(used))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Website Builder smoke
        run: npm run smoke:website-builder

      - name: Commit verified extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/website-builder/WebsiteBuilderTool.tsx src/modules/website-builder/core/website-builder-model.ts scripts/website-builder-smoke.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "[refactor-bot] Extract Website Builder data model"
          git push origin HEAD:refactor/website-builder-split-20260916
