name: Inspect remaining pure Website Builder helpers

on:
  push:
    branches:
      - refactor/website-builder-split-20260916
    paths:
      - .github/workflows/inspect-builder-pure-functions.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/website-builder-split-20260916
      - name: Print selected helper bodies
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          text = Path('src/modules/website-builder/WebsiteBuilderTool.tsx').read_text(encoding='utf-8')
          names = ['buildDeliveryReport', 'exportV1LaunchReport', 'cloneElementForInsertion', 'addFormField', 'exportAuditReport']

          def find_function(name):
            match = re.search(rf'(?m)^  (?:async\s+)?function\s+{re.escape(name)}\s*\(', text)
            if not match:
              return None
            brace = text.find('{', match.start())
            depth = 0
            quote = None
            escape = False
            i = brace
            while i < len(text):
              ch = text[i]
              if quote:
                if escape:
                  escape = False
                elif ch == '\\':
                  escape = True
                elif ch == quote:
                  quote = None
                i += 1
                continue
              if ch in "'\"`": quote = ch
              elif ch == '{': depth += 1
              elif ch == '}':
                depth -= 1
                if depth == 0:
                  return match.start(), i + 1
              i += 1
            return None

          for name in names:
            found = find_function(name)
            if not found:
              print(f'=== {name}: NOT FOUND ===')
              continue
            start, end = found
            line = text.count('\n', 0, start) + 1
            block = text[start:end]
            print(f'=== {name} | line={line} | bytes={len(block)} | refs={text.count(name)} ===')
            print(block)
            print(f'=== END {name} ===')
          PY
