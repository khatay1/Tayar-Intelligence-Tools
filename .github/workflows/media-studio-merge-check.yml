name: Temporary Media Studio Merge Check
on:
  push:
    branches: [merge/media-studio-max-20261004]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: sync Media Studio MAX lockfile"
            git push origin HEAD:merge/media-studio-max-20261004
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run smoke:media-studio
      - run: npm run smoke:media-studio:browser
      - run: npm run build
