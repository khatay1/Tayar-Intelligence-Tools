name: Tayar Mobile EAS Build Status

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/mobile-eas-build-status.yml'

permissions:
  contents: read

jobs:
  android-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Check Android signed build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@23.2.0 build:view 2006dccb-7c31-48c2-a2c6-4eb36b89780f --json
