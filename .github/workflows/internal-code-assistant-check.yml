name: Internal Coding Assistance Check

on:
  push:
    branches:
      - 'internal-code-assistant-registry-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-code-assistant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Coding Assistance smoke
        run: npm run smoke:code-assistant
