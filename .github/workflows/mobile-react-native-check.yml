name: Tayar React Native Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-react-native-check.yml'

concurrency:
  group: tayar-react-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Expo doctor
        run: npx expo-doctor@latest
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean
      - name: Build Android debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tayar-react-native-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Expo doctor
        run: npx expo-doctor@latest
      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean
      - name: Build iOS Simulator app without signing
        run: |
          xcodebuild \
            -workspace ios/TayarTools.xcworkspace \
            -scheme TayarTools \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
