name: Tayar React Native Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-react-native-check.yml'

permissions:
  contents: write

concurrency:
  group: tayar-react-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Refresh dependency lock
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Verify clean locked install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed mobile lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh mobile dependency lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"
