name: Tayar React Native Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-react-native-check.yml'

permissions:
  contents: write

concurrency:
  group: tayar-react-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Upload generated mobile lockfile
        uses: actions/upload-artifact@v4
        with:
          name: tayar-mobile-package-lock
          path: apps/mobile/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated mobile lockfile once
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 && git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already tracked and unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock mobile dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Prepare pinned mobile models
        run: npm run models:prepare
      - name: Typecheck
        run: npm run typecheck
      - name: Expo doctor
        run: npx expo-doctor@latest
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean
      - name: Build Android debug APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tayar-react-native-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare pinned mobile models
        run: npm run models:prepare
      - name: Typecheck
        run: npm run typecheck
      - name: Expo doctor
        run: npx expo-doctor@latest
      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --clean
      - name: Build iOS Simulator app without signing
        run: |
          xcodebuild \
            -workspace ios/TayarTools.xcworkspace \
            -scheme TayarTools \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
