name: Media Studio Verify Temp

# Temporary verification workflow for the isolated Media Studio branch.
on:
  push:
    branches:
      - feature/web-media-studio-max
    paths:
      - .github/workflows/media-studio-verify-temp.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Media Studio regression smoke
        run: node scripts/media-studio-max-smoke.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
