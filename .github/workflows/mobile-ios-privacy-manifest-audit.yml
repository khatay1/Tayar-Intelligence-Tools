name: Mobile iOS Privacy Manifest Audit

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/mobile-ios-privacy-manifest-audit.yml'

permissions:
  contents: read

jobs:
  privacy-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Collect dependency privacy reasons
        shell: bash
        run: |
          python - <<'PY'
          import glob, plistlib
          from collections import defaultdict
          manifests = sorted(glob.glob('node_modules/**/PrivacyInfo.xcprivacy', recursive=True))
          print(f'DEPENDENCY_PRIVACY_MANIFEST_COUNT={len(manifests)}')
          reasons = defaultdict(set)
          for path in manifests:
              try:
                  with open(path, 'rb') as fh:
                      data = plistlib.load(fh)
              except Exception as exc:
                  print(f'UNREADABLE {path}: {exc}')
                  continue
              for item in data.get('NSPrivacyAccessedAPITypes', []) or []:
                  category = item.get('NSPrivacyAccessedAPIType')
                  if not category:
                      continue
                  for reason in item.get('NSPrivacyAccessedAPITypeReasons', []) or []:
                      reasons[category].add(reason)
          for category in sorted(reasons):
              print(category + '=' + ','.join(sorted(reasons[category])))
          if not reasons:
              raise SystemExit('No required-reason API declarations found in dependency manifests')
          PY
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Report generated app privacy manifest
        shell: bash
        run: |
          mapfile -t manifests < <(find ios -name 'PrivacyInfo.xcprivacy' -type f | sort)
          printf 'APP_PRIVACY_MANIFEST_COUNT=%s\n' "${#manifests[@]}"
          for manifest in "${manifests[@]}"; do
            echo "=== $manifest ==="
            cat "$manifest"
          done
