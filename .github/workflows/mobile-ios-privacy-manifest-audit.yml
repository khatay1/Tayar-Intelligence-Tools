name: Mobile iOS Privacy Manifest Audit

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/mobile-ios-privacy-manifest-audit.yml'

permissions:
  contents: read

jobs:
  privacy-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Verify generated app privacy manifest
        shell: bash
        run: |
          mapfile -t manifests < <(find ios -name 'PrivacyInfo.xcprivacy' -type f | sort)
          printf 'APP_PRIVACY_MANIFEST_COUNT=%s\n' "${#manifests[@]}"
          test "${#manifests[@]}" -gt 0
          python - "${manifests[@]}" <<'PY'
          import plistlib, sys
          expected = {
              'NSPrivacyAccessedAPICategoryDiskSpace': {'85F4.1', 'E174.1'},
              'NSPrivacyAccessedAPICategoryFileTimestamp': {'0A2A.1', '3B52.1', 'C617.1'},
              'NSPrivacyAccessedAPICategorySystemBootTime': {'35F9.1'},
              'NSPrivacyAccessedAPICategoryUserDefaults': {'CA92.1'},
          }
          actual = {}
          tracking = None
          for path in sys.argv[1:]:
              with open(path, 'rb') as fh:
                  data = plistlib.load(fh)
              if 'NSPrivacyTracking' in data:
                  tracking = data['NSPrivacyTracking']
              for item in data.get('NSPrivacyAccessedAPITypes', []) or []:
                  category = item.get('NSPrivacyAccessedAPIType')
                  if category:
                      actual.setdefault(category, set()).update(item.get('NSPrivacyAccessedAPITypeReasons', []) or [])
          print('TRACKING=' + repr(tracking))
          for category in sorted(actual):
              print(category + '=' + ','.join(sorted(actual[category])))
          missing = {category: sorted(reasons - actual.get(category, set())) for category, reasons in expected.items() if not reasons.issubset(actual.get(category, set()))}
          if missing:
              raise SystemExit('Missing privacy reasons: ' + repr(missing))
          if tracking is not False:
              raise SystemExit('NSPrivacyTracking must be false')
          PY
