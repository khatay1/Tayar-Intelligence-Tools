name: Apply Final Mobile Release Hardening

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/mobile-release-hardening-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply lint and release hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new))

          replace('apps/mobile/app/tools/batch-image-tools.tsx', "\nfunction mime(format: OutputFormat) {\n  return format === 'JPEG' ? 'image/jpeg' : format === 'PNG' ? 'image/png' : 'image/webp';\n}\n", "\n")
          replace('apps/mobile/app/tools/team-workspace.tsx', "import { useEffect, useMemo, useState } from 'react';", "import { useEffect, useState } from 'react';")
          replace('apps/mobile/app/tools/templates-hub.tsx', "import { useEffect, useMemo, useState } from 'react';", "import { useCallback, useEffect, useMemo, useState } from 'react';")
          replace('apps/mobile/app/tools/templates-hub.tsx', "  async function load(nextPage: number, append: boolean) {\n    append ? setLoadingMore(true) : setBusy(true);", "  const load = useCallback(async (nextPage: number, append: boolean) => {\n    if (append) setLoadingMore(true);\n    else setBusy(true);")
          replace('apps/mobile/app/tools/templates-hub.tsx', "    } finally {\n      setBusy(false);\n      setLoadingMore(false);\n    }\n  }\n\n  useEffect(() => { void load(1, false); }, [submittedQuery, format]);", "    } finally {\n      setBusy(false);\n      setLoadingMore(false);\n    }\n  }, [submittedQuery, format]);\n\n  useEffect(() => { void load(1, false); }, [load]);")
          replace('apps/mobile/lib/background-removal.ts', "const MODEL_ASSET = require('../assets/models/u2netp_d0_320_fp16.tflite');", "// Metro resolves the bundled TFLite file as a native asset module.\n// eslint-disable-next-line @typescript-eslint/no-require-imports\nconst MODEL_ASSET = require('../assets/models/u2netp_d0_320_fp16.tflite');")
          replace('apps/mobile/app/(tabs)/home.tsx', "function displayPlan(value?: string) {", "const FEATURED_TOOLS = mobileTools.slice(0, 3);\n\nfunction displayPlan(value?: string) {")
          replace('apps/mobile/app/(tabs)/home.tsx', "  const featured = mobileTools.slice(0, 3);\n", "")
          replace('apps/mobile/app/(tabs)/home.tsx', 'featured.map', 'FEATURED_TOOLS.map')
          replace('apps/mobile/app/(tabs)/home.tsx', 'for (const tool of featured)', 'for (const tool of FEATURED_TOOLS)')
          replace('apps/mobile/app/(tabs)/home.tsx', '}, [accessByTool, featured]);', '}, [accessByTool]);')

          eas_path = Path('apps/mobile/eas.json')
          eas = json.loads(eas_path.read_text())
          eas.setdefault('cli', {})['appVersionSource'] = 'remote'
          eas.setdefault('build', {}).setdefault('production', {})['autoIncrement'] = True
          eas_path.write_text(json.dumps(eas, indent=2) + '\n')
          PY

          git config user.name "khatay1"
          git config user.email "khaled.m.tayar@gmail.com"
          git add apps/mobile
          git diff --cached --check
          git commit -m "Harden mobile lint and release versioning"
          git push origin HEAD:mobile-native-react-native-20260907
