name: Generate Account Deletion FK Migration

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/account-deletion-migration.yml'

permissions:
  contents: write

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Generate migration with Supabase CLI
        shell: bash
        run: |
          npx --yes supabase@2.116.0 migration new account_deletion_fk_cleanup
          migration_file="$(ls -1t supabase/migrations/*_account_deletion_fk_cleanup.sql | head -n 1)"
          test -n "$migration_file"
          cat > "$migration_file" <<'SQL'
          alter table public.tool_plan_limits
            drop constraint if exists tool_plan_limits_updated_by_fkey;

          alter table public.tool_plan_limits
            add constraint tool_plan_limits_updated_by_fkey
            foreign key (updated_by)
            references auth.users(id)
            on delete set null;
          SQL

          git config user.name "khatay1"
          git config user.email "khaled.m.tayar@gmail.com"
          git add "$migration_file"
          git diff --cached --check
          git commit -m "Allow account deletion after plan limit updates"
          git push origin HEAD:mobile-native-react-native-20260907
