name: Release Gate

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      booking-postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: booking-test-only
          POSTGRES_DB: tayar_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tayar_booking_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Project health
        run: npm run health:project

      - name: Coding Assistance smoke
        run: npm run smoke:code-assistant

      - name: Localization and published storage regression
        run: node scripts/website-builder-localization-regression.mjs

      - name: Custom domain regression
        run: node scripts/website-custom-domain-regression.mjs

      - name: Collaboration MAX regression
        run: npm run smoke:website-builder:collaboration

      - name: AI quality and design system regression
        run: node scripts/website-design-system-regression.mjs

      - name: Website Builder browser regression
        run: timeout 75s npm run smoke:website-builder:browser

      - name: Application booking database regression
        env:
          TAYAR_BOOKING_TEST_DATABASE_URL: postgres://postgres:booking-test-only@localhost:5432/tayar_booking_test
        run: |
          timeout 45s node scripts/application-booking-regression.mjs --postgres
          timeout 45s node scripts/application-counter-regression.mjs --postgres
          timeout 45s node scripts/application-transaction-regression.mjs --postgres

      - name: Application data view browser regression
        id: data-view-browser
        run: |
          set -o pipefail
          timeout 40s npm run smoke:website-builder:data-views:browser 2>&1 | tee /tmp/tayar-data-view-browser.log

      - name: Preserve data view browser failure
        if: failure() && steps.data-view-browser.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data-view-browser-failure
          path: /tmp/tayar-data-view-browser.log
          retention-days: 3

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Whitespace check
        run: git diff --check
