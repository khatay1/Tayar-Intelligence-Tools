name: Release Gate

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      booking-postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: booking-test-only
          POSTGRES_DB: tayar_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tayar_booking_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Historical migration source identity (offline, no database writes)
        run: |
          node scripts/migration-source-map-regression.mjs
          node scripts/verify-migration-source-map.mjs

      - name: Customer deployed runtime identity regression
        run: |
          node scripts/website-owned-runtime-verification-regression.mjs
          node scripts/website-owned-release-behavior-regression.mjs
          node scripts/website-owned-preview-origin-regression.mjs
          node scripts/website-production-candidate-regression.mjs
          node scripts/website-production-source-candidate-regression.mjs
          node scripts/website-owned-vercel-staging-regression.mjs
          node scripts/website-production-staging-worker-regression.mjs
          node scripts/website-owned-production-backend-verification-regression.mjs


      - name: Bounded customer deployment heartbeat evidence regression
        run: node --experimental-strip-types scripts/website-owned-uptime-evidence-regression.mjs

      - name: Project health
        run: npm run health:project

      - name: Coding Assistance smoke
        run: npm run smoke:code-assistant

      - name: Pure inventory reservation preflight regression
        run: node --experimental-strip-types scripts/application-inventory-reservations-regression.mjs

      - name: Generated app stock reservation opt-in contract regression
        run: node scripts/application-stock-reservation-opt-in-regression.mjs

      - name: Application reference project generation regression
        run: node scripts/application-reference-projects-regression.mjs
      - name: Generated application page browser regression
        run: timeout 45s node scripts/application-reference-page-browser-regression.mjs

      - name: Isolated custom code execution boundary regression
        run: node scripts/isolated-code-execution-regression.mjs

      - name: Published custom operation authorization and quota gate regression
        run: node scripts/website-application-custom-operation-regression.mjs

      - name: Custom operation release artifact and delivery blocking regressions
        run: |
          node scripts/project-specification-regression.mjs
          node scripts/application-requirement-coverage-regression.mjs
          node scripts/website-application-custom-operation-release-regression.mjs
          npx tsc --noEmit --strict --target ES2020 --lib ES2020,DOM --moduleResolution bundler --module ESNext server/website-application-custom-operation-release.ts

      - name: Published custom operation HTTP route regression
        run: node scripts/website-application-custom-operation-route-regression.mjs

      - name: Published custom operation runtime composition regression
        run: node scripts/website-application-custom-operation-runtime-regression.mjs

      - name: Published custom operation browser client regression
        run: node scripts/application-custom-operation-client-regression.mjs

      - name: Declarative custom operation action and input regression
        run: node scripts/application-custom-operation-actions-regression.mjs

      - name: Custom operation action end-to-end flow regression
        run: node scripts/application-custom-operation-action-flow-regression.mjs

      - name: Website custom execution quota regression
        run: node scripts/website-custom-execution-quota-regression.mjs

      - name: Vercel Sandbox execution adapter regression
        run: node scripts/vercel-sandbox-execution-adapter-regression.mjs

      - name: Localization and published storage regression
        run: node scripts/website-builder-localization-regression.mjs

      - name: Custom domain regression
        run: node scripts/website-custom-domain-regression.mjs

      - name: Collaboration MAX regression
        run: npm run smoke:website-builder:collaboration

      - name: AI quality and design system regression
        run: node scripts/website-design-system-regression.mjs

      - name: Website Builder AI application repair and undo regression
        run: |
          node scripts/website-builder-application-repair-regression.mjs
          node scripts/website-builder-ai-undo-regression.mjs

      - name: Website Builder browser regression
        run: timeout 75s npm run smoke:website-builder:browser

      - name: Application booking database regression
        env:
          TAYAR_BOOKING_TEST_DATABASE_URL: postgres://postgres:booking-test-only@localhost:5432/tayar_booking_test
        run: |
          timeout 45s node scripts/application-booking-regression.mjs --postgres
          timeout 45s node scripts/application-counter-regression.mjs --postgres
          timeout 45s node scripts/application-transaction-regression.mjs --postgres
          timeout 45s node scripts/application-workflow-regression.mjs --postgres
          timeout 45s node scripts/application-formula-regression.mjs --postgres
          timeout 45s node scripts/application-files-regression.mjs --postgres
          timeout 45s node scripts/website-owned-email-regression.mjs --postgres
          timeout 45s node scripts/website-owned-stripe-webhook-regression.mjs --postgres
          timeout 45s node scripts/application-reference-projects-regression.mjs --postgres
          psql "$TAYAR_BOOKING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'create database tayar_custom_execution_quota_test;'
          TAYAR_CUSTOM_EXECUTION_QUOTA_TEST_DATABASE_URL=postgres://postgres:booking-test-only@localhost:5432/tayar_custom_execution_quota_test node scripts/website-custom-execution-quota-postgres-regression.mjs

      - name: Isolated stock reservation PostgreSQL regression
        env:
          TAYAR_BOOKING_TEST_DATABASE_URL: postgres://postgres:booking-test-only@localhost:5432/tayar_booking_test
          TAYAR_INVENTORY_RESERVATION_TEST_DATABASE_URL: postgres://postgres:booking-test-only@localhost:5432/tayar_inventory_reservation_test
        run: |
          psql "$TAYAR_BOOKING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'create database tayar_inventory_reservation_test;'
          timeout 45s node scripts/application-inventory-reservation-postgres-regression.mjs --postgres

      - name: Physical stock location PostgreSQL regression
        env:
          TAYAR_BOOKING_TEST_DATABASE_URL: postgres://postgres:booking-test-only@localhost:5432/tayar_booking_test
          TAYAR_STOCK_LOCATIONS_TEST_DATABASE_URL: postgres://postgres:booking-test-only@localhost:5432/tayar_stock_locations_test
        run: |
          psql "$TAYAR_BOOKING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'create database tayar_stock_locations_test;'
          timeout 45s node scripts/application-stock-locations-regression.mjs --postgres

      - name: Isolated Production source and runtime receipt database regression
        env:
          TAYAR_BOOKING_TEST_DATABASE_URL: postgres://postgres:booking-test-only@localhost:5432/tayar_booking_test
          TAYAR_PRODUCTION_CANDIDATE_TEST_DATABASE_URL: postgres://postgres:booking-test-only@localhost:5432/tayar_production_candidate_test
        run: |
          psql "$TAYAR_BOOKING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'create database tayar_production_candidate_test;'
          timeout 45s node scripts/website-production-source-candidate-postgres-regression.mjs

      - name: Application report database regression
        env:
          TAYAR_BOOKING_TEST_DATABASE_URL: postgres://postgres:booking-test-only@localhost:5432/tayar_booking_test
          TAYAR_REPORTS_TEST_DATABASE_URL: postgres://postgres:booking-test-only@localhost:5432/tayar_reports_test
        run: |
          psql "$TAYAR_BOOKING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'create database tayar_reports_test;'
          timeout 45s node scripts/application-reports-regression.mjs --postgres

      - name: Application data view browser regression
        id: data-view-browser
        run: |
          set -o pipefail
          timeout 40s npm run smoke:website-builder:data-views:browser 2>&1 | tee /tmp/tayar-data-view-browser.log

      - name: Platform advisor migration regression
        env:
          TAYAR_BOOKING_TEST_DATABASE_URL: postgres://postgres:booking-test-only@localhost:5432/tayar_booking_test
          TAYAR_ADVISOR_TEST_DATABASE_URL: postgres://postgres:booking-test-only@localhost:5432/tayar_advisor_test
        run: |
          psql "$TAYAR_BOOKING_TEST_DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'create database tayar_advisor_test;'
          timeout 45s node scripts/phase-zero-advisor-regression.mjs --postgres

      - name: Preserve data view browser failure
        if: failure() && steps.data-view-browser.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data-view-browser-failure
          path: /tmp/tayar-data-view-browser.log
          retention-days: 3

      - name: Application notification editor browser regression
        run: timeout 40s node scripts/application-notifications-browser-regression.mjs

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Whitespace check
        run: git diff --check
