name: Guarded Website Builder billing pure split

on:
  push:
    branches:
      - refactor/website-builder-split-20260916
    paths:
      - .github/workflows/refactor-builder-billing-pure.yml

permissions:
  contents: write

jobs:
  extract-billing-pure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/website-builder-split-20260916
          fetch-depth: 0

      - name: Extract billing normalization helpers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('src/modules/website-builder/WebsiteBuilderTool.tsx')
          config_path = Path('src/modules/website-builder/core/website-builder-config.ts')
          source = source_path.read_text(encoding='utf-8')
          config = config_path.read_text(encoding='utf-8')

          effective_start_marker = '  function effectiveProductionConfig(): WebsiteProductionConfig {'
          effective_end_marker = '  const refreshBilling = useCallback(async ('
          raw_start_marker = '    const raw = data as Record<string, unknown>;'
          raw_end_marker = '    setBillingLoading(false);\n  }, [user?.id, pages.length, cloudProjectId]);'
          for marker in [effective_start_marker, effective_end_marker, raw_start_marker, raw_end_marker]:
              if source.count(marker) != 1:
                  raise SystemExit(f'Billing marker count changed for {marker!r}; refusing.')

          effective_start = source.index(effective_start_marker)
          effective_end = source.index(effective_end_marker, effective_start)
          effective_block = source[effective_start:effective_end]
          if not 450 <= len(effective_block) <= 1300:
              raise SystemExit(f'Effective production block size unexpected ({len(effective_block)} bytes); refusing.')
          for required in ['customCss:', 'ga4Id:', 'gtmId:', 'metaPixelId:', 'plausibleDomain:']:
              if required not in effective_block:
                  raise SystemExit(f'Effective production behavior missing {required}; refusing.')

          raw_start = source.index(raw_start_marker)
          raw_end = source.index(raw_end_marker, raw_start)
          raw_block = source[raw_start:raw_end]
          if not 1500 <= len(raw_block) <= 5200:
              raise SystemExit(f'Billing normalization block size unexpected ({len(raw_block)} bytes); refusing.')
          for required in [
              "raw.plan === 'business'",
              "raw.plan === 'pro'",
              'LOCAL_BILLING_ENTITLEMENTS[rawPlan]',
              'maxWebsiteProjects:',
              'maxReleaseHistory:',
              'maxAnalyticsEvents:',
              'analyticsEvents:',
          ]:
              if required not in raw_block:
                  raise SystemExit(f'Billing normalization behavior missing {required}; refusing.')
          for forbidden in ['await ', 'setBillingError(', 'setBillingLoading(true)', 'window.', 'useState(']:
              if forbidden in raw_block:
                  raise SystemExit(f'Unexpected stateful/async behavior in billing normalization ({forbidden}); refusing.')

          helper_lines = [
              '',
              'export function resolveEffectiveProductionConfig(',
              '  productionConfig: WebsiteProductionConfig,',
              '  billingEntitlements: BillingEntitlements,',
              '): WebsiteProductionConfig {',
              '  return {',
              '    ...productionConfig,',
              "    customCss: billingEntitlements.features.customCss ? productionConfig.customCss : '',",
              "    ga4Id: billingEntitlements.features.productionIntegrations ? productionConfig.ga4Id : '',",
              "    gtmId: billingEntitlements.features.productionIntegrations ? productionConfig.gtmId : '',",
              "    metaPixelId: billingEntitlements.features.productionIntegrations ? productionConfig.metaPixelId : '',",
              "    plausibleDomain: billingEntitlements.features.productionIntegrations ? productionConfig.plausibleDomain : '',",
              '  };',
              '}',
              '',
              'export function normalizeBillingStatePayload(',
              '  data: Record<string, unknown>,',
              '  pageCount: number,',
              '): BillingState {',
              "  const rawPlan = data.plan === 'business' ? 'business' : data.plan === 'pro' ? 'pro' : 'free';",
              "  const rawEntitlements = data.entitlements && typeof data.entitlements === 'object'",
              '    ? data.entitlements as Record<string, unknown>',
              '    : {};',
              "  const rawFeatures = rawEntitlements.features && typeof rawEntitlements.features === 'object'",
              '    ? rawEntitlements.features as Partial<Record<BillingFeature, boolean>>',
              '    : {};',
              '  const local = LOCAL_BILLING_ENTITLEMENTS[rawPlan];',
              '  const entitlements: BillingEntitlements = {',
              '    plan: rawPlan,',
              '    maxPages: Number(rawEntitlements.maxPages) || local.maxPages,',
              '    maxWebsiteProjects: Number(rawEntitlements.maxWebsiteProjects) || local.maxWebsiteProjects,',
              '    maxReleaseHistory: Number(rawEntitlements.maxReleaseHistory) || local.maxReleaseHistory,',
              '    maxLeads: Number(rawEntitlements.maxLeads) || local.maxLeads,',
              '    maxAnalyticsEvents: Number(rawEntitlements.maxAnalyticsEvents) || local.maxAnalyticsEvents,',
              '    features: { ...local.features, ...rawFeatures },',
              '  };',
              "  const rawUsage = data.usage && typeof data.usage === 'object' ? data.usage as Record<string, unknown> : {};",
              '',
              '  return {',
              '    plan: rawPlan,',
              '    entitlements,',
              "    subscription: data.subscription && typeof data.subscription === 'object'",
              '      ? data.subscription as BillingSubscriptionSnapshot',
              '      : null,',
              '    usage: {',
              '      websiteProjects: Number(rawUsage.websiteProjects) || 0,',
              '      pages: pageCount,',
              '      releases: Number(rawUsage.releases) || 0,',
              '      leads: Number(rawUsage.leads) || 0,',
              '      analyticsEvents: Number(rawUsage.analyticsEvents) || 0,',
              '    },',
              '  };',
              '}',
              '',
          ]
          helpers = '\n'.join(helper_lines)

          if 'export function resolveEffectiveProductionConfig(' in config or 'export function normalizeBillingStatePayload(' in config:
              raise SystemExit('Billing helper already exists in config; refusing.')

          config_type_anchor = '  BillingEntitlements, BillingPlan, WebsiteFooterConfig, WebsiteHeaderConfig,\n'
          if config.count(config_type_anchor) != 1:
              raise SystemExit('Config billing type import anchor changed; refusing.')
          config = config.replace(
              config_type_anchor,
              '  BillingEntitlements, BillingFeature, BillingPlan, BillingState, BillingSubscriptionSnapshot, WebsiteFooterConfig, WebsiteHeaderConfig,\n',
              1,
          )
          config = config.rstrip() + '\n' + helpers

          next_source = source[:effective_start] + '  function effectiveProductionConfig(): WebsiteProductionConfig {\n    return resolveEffectiveProductionConfig(productionConfig, billingEntitlements);\n  }\n\n' + source[effective_end:]

          raw_start = next_source.index(raw_start_marker)
          raw_end = next_source.index(raw_end_marker, raw_start)
          next_source = next_source[:raw_start] + '    setBillingState(normalizeBillingStatePayload(data as Record<string, unknown>, pages.length));\n' + next_source[raw_end:]

          config_import_anchor = "  normalizeTheme,\n  applyThemeToSection,\n} from './core/website-builder-config';"
          if next_source.count(config_import_anchor) != 1:
              raise SystemExit('Main config import anchor changed; refusing.')
          next_source = next_source.replace(
              config_import_anchor,
              "  normalizeTheme,\n  applyThemeToSection,\n  resolveEffectiveProductionConfig,\n  normalizeBillingStatePayload,\n} from './core/website-builder-config';",
              1,
          )

          for obsolete in [
              '  type BillingEntitlements,\n',
              '  type BillingSubscriptionSnapshot,\n',
              '  LOCAL_BILLING_ENTITLEMENTS,\n',
          ]:
              token = obsolete.strip().rstrip(',')
              if next_source.count(token) != 1:
                  raise SystemExit(f'Expected only obsolete import use for {token}; refusing.')
              next_source = next_source.replace(obsolete, '', 1)

          if 'const rawEntitlements =' in next_source[raw_start:raw_start + 4000]:
              raise SystemExit('Old billing normalization remained; refusing.')
          if len(next_source) >= len(source) - 1700:
              raise SystemExit('WebsiteBuilderTool.tsx did not shrink enough; refusing.')

          source_path.write_text(next_source, encoding='utf-8')
          config_path.write_text(config, encoding='utf-8')
          print(f'WebsiteBuilderTool.tsx: {len(source)} -> {len(next_source)} bytes')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Website Builder smoke
        run: npm run smoke:website-builder

      - name: Commit verified extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/website-builder/WebsiteBuilderTool.tsx src/modules/website-builder/core/website-builder-config.ts
          git diff --cached --check
          git diff --cached --stat
          git commit -m "[refactor-bot] Extract builder billing normalization"
          git push origin HEAD:refactor/website-builder-split-20260916
