name: Media Studio Lock Sync

on:
  push:
    branches:
      - feature/web-media-studio-max
    paths:
      - package.json
      - .github/workflows/media-studio-lock-sync.yml

permissions:
  contents: write

concurrency:
  group: media-studio-lock-sync
  cancel-in-progress: true

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/web-media-studio-max

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync Media Studio FFmpeg lockfile"
          git push origin HEAD:feature/web-media-studio-max
