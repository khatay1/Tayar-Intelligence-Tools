name: Guarded Website Builder rendering split

on:
  push:
    branches:
      - refactor/website-builder-split-20260916
    paths:
      - .github/workflows/refactor-website-builder-rendering.yml

permissions:
  contents: write

jobs:
  extract-builder-rendering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/website-builder-split-20260916
          fetch-depth: 0

      - name: Extract pure rendering helpers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/modules/website-builder/WebsiteBuilderTool.tsx')
          module_path = Path('src/modules/website-builder/core/website-builder-rendering.ts')
          smoke_path = Path('scripts/website-builder-smoke.mjs')
          text = source_path.read_text(encoding='utf-8')

          start_marker = 'function sectionColumnCount('
          end_marker = 'function ElementPreview('
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Rendering markers are not unique; refusing.')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end].rstrip() + '\n'
          if not 40000 <= len(block) <= 180000:
              raise SystemExit(f'Rendering block size unexpected ({len(block)} bytes); refusing.')

          required = [
              'function sectionColumnCount(',
              'function elementVisualCss(',
              'function buildResponsiveElementCss(',
              'function sectionElementsToHtml(',
              'function buildFullHtml(',
              'function effectiveStyle(',
              'function effectiveSectionStyle(',
          ]
          missing = [marker for marker in required if marker not in block]
          if missing:
              raise SystemExit(f'Expected rendering helpers missing: {missing}')
          if 'useState(' in block or 'useEffect(' in block or 'useRef(' in block:
              raise SystemExit('React hook detected in rendering block; refusing.')

          groups = [
              ('@/lib/ui-localization', False, ['localizeUi']),
              ('@/context/PreferencesContext', True, ['Language']),
              ('@/lib/published-site-url', False, [
                  'buildPreviewSiteBaseUrl', 'buildPreviewSiteUrl', 'buildPublishedSiteBaseUrl',
                  'buildPublishedSiteUrl', 'normalizePublishedSiteUrl',
              ]),
              ('./types', True, [
                  'Device', 'ElementAnimation', 'ElementShadow', 'SectionBackgroundMode',
                  'SectionBackgroundPosition', 'SectionBackgroundSize', 'SectionContentWidth',
                  'SectionLayout', 'SectionLayoutAlign', 'SectionResponsiveStyle', 'SectionType',
                  'WebsiteBrand', 'WebsiteElement', 'WebsiteElementContainer', 'WebsiteElementType',
                  'WebsiteFormField', 'WebsiteFormFieldType', 'WebsiteSEO', 'WebsiteSection',
              ]),
              ('./defaults', False, [
                  'ELEMENT_LABELS', 'SECTION_LABELS', 'createDefaultContactFormFields',
                  'createSection', 'defaultBrand', 'defaultSEO', 'defaultSections', 'normalizeSection',
              ]),
              ('./project-identifiers', False, [
                  'languageCodeLabel', 'normalizePageLanguage', 'normalizeSlug', 'PAGE_LANGUAGE_LABELS',
              ]),
              ('./website-builder-model', True, [
                  'WebsitePage', 'WebsiteClipboardContext', 'WebsiteClipboard', 'AIWebsiteUndoSnapshot',
                  'CloudWebsiteProject', 'ProjectHistoryEntry', 'LeadStage', 'WebsiteLead',
                  'LeadCaptureConfig', 'WebsiteAnalyticsEvent', 'WebsiteMediaAsset', 'WebsiteTheme',
                  'WebsiteHeaderConfig', 'WebsiteFooterConfig', 'WebsiteSiteEnhancements',
                  'WebsiteProductionConfig', 'WebsiteSymbol', 'AIWebsiteCandidatePreview',
                  'PersistedWebsiteProject', 'WebsitePublishVersion', 'LiveVerification', 'BillingPlan',
                  'BillingFeature', 'BillingEntitlements', 'BillingSubscriptionSnapshot', 'BillingState',
                  'ReusableSectionTemplate',
              ]),
              ('./website-builder-config', False, [
                  'REUSABLE_SECTIONS_KEY', 'FONT_OPTIONS', 'DEFAULT_THEME', 'DEFAULT_HEADER_CONFIG',
                  'DEFAULT_FOOTER_CONFIG', 'DEFAULT_SITE_ENHANCEMENTS', 'DEFAULT_PRODUCTION_CONFIG',
                  'FREE_BILLING_ENTITLEMENTS', 'PRO_BILLING_ENTITLEMENTS',
                  'BUSINESS_BILLING_ENTITLEMENTS', 'LOCAL_BILLING_ENTITLEMENTS',
                  'BILLING_PLAN_DETAILS', 'sanitizeCustomCss', 'sanitizeRobotsRules',
                  'normalizeProductionConfig', 'normalizeHeaderConfig', 'normalizeFooterConfig',
                  'normalizeSiteEnhancements', 'safeSocialUrl', 'normalizeTheme',
              ]),
              ('./delivery-config', False, ['DEFAULT_DELIVERY_CONFIG', 'normalizeDeliveryConfig']),
              ('./delivery-config', True, ['DeliveryStatus', 'WebsiteDeliveryConfig']),
          ]

          imports = []
          for module, type_only, names in groups:
              used = [name for name in names if re.search(rf'\b{re.escape(name)}\b', block)]
              if not used:
                  continue
              prefix = 'import type' if type_only else 'import'
              imports.append(f"{prefix} {{ {', '.join(used)} }} from '{module}';")

          header = '\n'.join(imports) + '\n\n'
          exported = re.sub(r'(?m)^(interface|type|const|function) ', r'export \1 ', block)
          module_text = header + exported

          declarations = re.findall(r'(?m)^(?:interface|type|const|function)\s+([A-Za-z0-9_]+)', block)
          type_names = set(re.findall(r'(?m)^(?:interface|type)\s+([A-Za-z0-9_]+)', block))
          remainder = text[:start] + text[end:]
          used_outside = [name for name in declarations if re.search(rf'\b{re.escape(name)}\b', remainder)]
          if len(used_outside) < 8 or 'effectiveStyle' not in used_outside or 'clampElementNumber' not in used_outside:
              raise SystemExit(f'Unexpected remaining rendering references ({len(used_outside)}): {used_outside}')

          cleanup_pairs = [
              ("import { localizeUi, useLocalizer } from '@/lib/ui-localization';", "import { useLocalizer } from '@/lib/ui-localization';"),
              ('  type LeadCaptureConfig,\n', ''),
              ('  sanitizeCustomCss,\n', ''),
              ('  safeSocialUrl,\n', ''),
          ]
          for old, new in cleanup_pairs:
              if remainder.count(old) != 1:
                  raise SystemExit(f'Expected import cleanup anchor missing or duplicated: {old!r}')
              remainder = remainder.replace(old, new, 1)

          import_lines = ['import {']
          for name in used_outside:
              import_lines.append(f"  {'type ' if name in type_names else ''}{name},")
          import_lines.append("} from './core/website-builder-rendering';")
          import_text = '\n'.join(import_lines) + '\n'

          anchor = "} from './core/website-builder-config';\n"
          if remainder.count(anchor) != 1:
              raise SystemExit('Builder config import anchor changed; refusing.')
          remainder = remainder.replace(anchor, anchor + import_text, 1)
          if start_marker in remainder:
              raise SystemExit('Rendering block remained after extraction.')
          if len(remainder) >= len(text) - 35000:
              raise SystemExit('WebsiteBuilderTool.tsx did not shrink enough; refusing.')

          smoke = smoke_path.read_text(encoding='utf-8')
          path_anchor = "const websiteBuilderConfigPath = resolve(root, 'src/modules/website-builder/core/website-builder-config.ts');\n"
          if smoke.count(path_anchor) != 1:
              raise SystemExit('Smoke config path anchor changed; refusing.')
          smoke = smoke.replace(
              path_anchor,
              path_anchor + "const websiteBuilderRenderingPath = resolve(root, 'src/modules/website-builder/core/website-builder-rendering.ts');\n",
              1,
          )

          existence_anchor = "  ['Website Builder config module exists', websiteBuilderConfigPath],\n"
          if smoke.count(existence_anchor) != 1:
              raise SystemExit('Smoke config existence anchor changed; refusing.')
          smoke = smoke.replace(
              existence_anchor,
              existence_anchor + "  ['Website Builder rendering module exists', websiteBuilderRenderingPath],\n",
              1,
          )

          read_anchor = "const websiteBuilderConfig = existsSync(websiteBuilderConfigPath) ? readFileSync(websiteBuilderConfigPath, 'utf8') : '';\n"
          if smoke.count(read_anchor) != 1:
              raise SystemExit('Smoke config read anchor changed; refusing.')
          smoke = smoke.replace(
              read_anchor,
              read_anchor + "const websiteBuilderRendering = existsSync(websiteBuilderRenderingPath) ? readFileSync(websiteBuilderRenderingPath, 'utf8') : '';\n",
              1,
          )

          composite_old = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}\\n${editorAIReviewTargets}\\n${websiteBuilderModel}\\n${websiteBuilderConfig}`;\n"
          composite_new = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}\\n${editorAIReviewTargets}\\n${websiteBuilderModel}\\n${websiteBuilderConfig}\\n${websiteBuilderRendering}`;\n"
          if smoke.count(composite_old) != 1:
              raise SystemExit('Smoke composite source anchor changed; refusing.')
          smoke = smoke.replace(composite_old, composite_new, 1)

          source_path.write_text(remainder, encoding='utf-8')
          module_path.write_text(module_text, encoding='utf-8')
          smoke_path.write_text(smoke, encoding='utf-8')

          print(f'Rendering extracted: {len(block)} bytes, {len(declarations)} declarations')
          print(f'WebsiteBuilderTool.tsx: {len(text)} -> {len(remainder)} bytes')
          print('Re-imported:', ', '.join(used_outside))
          print('Imports:', *imports, sep='\n  ')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Website Builder smoke
        run: npm run smoke:website-builder

      - name: Commit verified extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/website-builder/WebsiteBuilderTool.tsx src/modules/website-builder/core/website-builder-rendering.ts scripts/website-builder-smoke.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "[refactor-bot] Extract Website Builder rendering"
          git push origin HEAD:refactor/website-builder-split-20260916
