name: Temporary Tayar EAS APK Verification v2

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/mobile-eas-apk-verify-temp.yml

permissions:
  contents: read

jobs:
  verify-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: f45a7566-48ac-415b-a913-d09ba6ce435f
      SOURCE_COMMIT: 5c20f0d7bf9c225b45e4fbddcf70b15ffc41e801
      EXPECTED_VERSION_CODE: '4'
      APK_NAME: tayar-tools-v0.2.0-4.apk

    steps:
      - name: Checkout exact green candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install locked mobile dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch and validate exact EAS build
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@23.2.0 build:view "$BUILD_ID" --json > /tmp/eas-build.json
          node - <<'NODE'
          const fs = require('fs');
          const build = JSON.parse(fs.readFileSync('/tmp/eas-build.json', 'utf8'));
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          const failed = [];
          const expect = (ok, detail) => { if (!ok) failed.push(detail); };
          expect(build.id === process.env.BUILD_ID, `id=${build.id}`);
          expect(build.status === 'FINISHED', `status=${build.status}`);
          expect(build.platform === 'ANDROID', `platform=${build.platform}`);
          expect(build.distribution === 'INTERNAL', `distribution=${build.distribution}`);
          expect(build.buildProfile === 'direct', `buildProfile=${build.buildProfile}`);
          expect(build.appIdentifier === 'se.tayar.tools', `appIdentifier=${build.appIdentifier}`);
          expect(String(build.appBuildVersion) === process.env.EXPECTED_VERSION_CODE, `appBuildVersion=${build.appBuildVersion}`);
          expect(build.gitCommitHash === process.env.SOURCE_COMMIT, `gitCommitHash=${build.gitCommitHash}`);
          expect(typeof url === 'string' && url.length > 0, `artifact=${url}`);
          if (failed.length) throw new Error(`EAS build validation failed: ${failed.join(', ')}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `APK_URL=${url}\n`);
          console.log(`Validated EAS build ${build.id}: ${build.appIdentifier} ${build.appVersion} (${build.appBuildVersion})`);
          console.log(`Git commit: ${build.gitCommitHash}`);
          NODE

      - name: Download APK and compute SHA-256
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$APK_NAME" "$APK_URL"
          test -s "$APK_NAME"
          file "$APK_NAME"
          unzip -t "$APK_NAME" >/dev/null
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"

      - name: Verify Android signature and 16 KB ZIP alignment
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK_NAME"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK_NAME"
          echo "APK signature and 16 KB ZIP alignment verified."

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayar-tools-android-direct-v0.2.0-4
          path: |
            apps/mobile/tayar-tools-v0.2.0-4.apk
            apps/mobile/tayar-tools-v0.2.0-4.apk.sha256
          if-no-files-found: error
          retention-days: 30
