name: Temporary Tayar EAS APK Verification

on:
  pull_request:
    branches:
      - main
    types: [synchronize]
    paths:
      - '.github/workflows/mobile-eas-build-monitor-temp.yml'

permissions:
  contents: read

jobs:
  verify-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: f45a7566-48ac-415b-a913-d09ba6ce435f
      SOURCE_COMMIT: 5c20f0d7bf9c225b45e4fbddcf70b15ffc41e801
      EXPECTED_VERSION_CODE: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5c20f0d7bf9c225b45e4fbddcf70b15ffc41e801

      - name: Validate Expo credential
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          test -f apps/mobile/app.json
          test -f apps/mobile/eas.json

      - name: Wait for EAS build and validate metadata
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if ! npx --yes eas-cli@23.2.0 build:view "$BUILD_ID" --json > /tmp/eas-build.json; then
              echo "EAS build:view not ready (attempt $attempt/120); retrying."
              sleep 20
              continue
            fi
            STATUS="$(node -e "const b=require('/tmp/eas-build.json'); process.stdout.write(String(b.status||''))")"
            echo "EAS status: $STATUS (attempt $attempt/120)"
            if [ "$STATUS" = "FINISHED" ]; then
              break
            fi
            if [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELED" ]; then
              cat /tmp/eas-build.json
              exit 1
            fi
            sleep 20
          done

          node - <<'NODE'
          const fs = require('fs');
          const build = JSON.parse(fs.readFileSync('/tmp/eas-build.json', 'utf8'));
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          const failed = [];
          const expect = (ok, detail) => { if (!ok) failed.push(detail); };
          expect(build.status === 'FINISHED', `status=${build.status}`);
          expect(build.platform === 'ANDROID', `platform=${build.platform}`);
          expect(build.distribution === 'INTERNAL', `distribution=${build.distribution}`);
          expect(build.buildProfile === 'direct', `buildProfile=${build.buildProfile}`);
          expect(build.appIdentifier === 'se.tayar.tools', `appIdentifier=${build.appIdentifier}`);
          expect(String(build.appBuildVersion) === process.env.EXPECTED_VERSION_CODE, `appBuildVersion=${build.appBuildVersion}`);
          expect(build.gitCommitHash === process.env.SOURCE_COMMIT, `gitCommitHash=${build.gitCommitHash}`);
          expect(typeof url === 'string' && url.length > 0, `artifact=${url}`);
          if (failed.length) throw new Error(`EAS build validation failed: ${failed.join(', ')}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `APK_URL=${url}\n`);
          console.log(`Validated EAS build ${build.id}: ${build.appIdentifier} ${build.appVersion} (${build.appBuildVersion})`);
          NODE

      - name: Download APK and compute SHA-256
        run: |
          set -euo pipefail
          FILE="tayar-tools-v0.2.0-4.apk"
          curl --fail --location --retry 3 --output "$FILE" "$APK_URL"
          test -s "$FILE"
          unzip -t "$FILE" >/dev/null
          SHA="$(sha256sum "$FILE" | cut -d' ' -f1)"
          printf '%s  %s\n' "$SHA" "$FILE" > "$FILE.sha256"
          echo "APK_FILE=$FILE" >> "$GITHUB_ENV"
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "APK SHA-256: $SHA"

      - name: Verify Android signature and 16 KB ZIP alignment
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          "$APKSIGNER" verify --verbose --print-certs "$APK_FILE"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK_FILE"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tayar-tools-android-direct-v0.2.0-4
          path: |
            tayar-tools-v0.2.0-4.apk
            tayar-tools-v0.2.0-4.apk.sha256
          if-no-files-found: error
          retention-days: 14
