name: Temporary Application Release Regeneration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/regenerate-application-release.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - run: npm ci
      - run: node scripts/build-application-release.mjs
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- supabase/functions/website-application-release/index.ts; then
            echo "Bundle already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/website-application-release/index.ts
          git commit -m "build: regenerate application release bundle"
          git pull --rebase origin main
          git push origin HEAD:main
