name: Mobile Release Bundle Audit

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/mobile-release-bundle-audit.yml'

permissions:
  contents: read

jobs:
  android-release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare pinned mobile models
        run: npm run models:prepare
      - name: Typecheck
        run: npm run typecheck
      - name: Expo doctor
        run: npx expo-doctor@latest
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean
      - name: Build release AAB for audit
        run: cd android && ./gradlew :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tayar-android-release-aab-audit
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
