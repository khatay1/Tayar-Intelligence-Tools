name: Refresh Mobile System UI Lockfile

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/mobile-system-ui-lock-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile-native-react-native-20260907
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Refresh package lock only
        working-directory: apps/mobile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Verify locked install resolves
        working-directory: apps/mobile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- apps/mobile/package-lock.json; then
            echo 'LOCKFILE_ALREADY_CURRENT'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/package-lock.json
          git commit -m 'Lock Expo system UI dependency'
          git push origin HEAD:mobile-native-react-native-20260907
