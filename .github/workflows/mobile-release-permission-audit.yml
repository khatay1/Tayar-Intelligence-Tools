name: Mobile Release Permission Audit

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/mobile-release-permission-audit.yml'

permissions:
  contents: read

# Re-run after blocking READ_PHONE_STATE in the final release manifest.
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare pinned mobile models
        run: npm run models:prepare
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean
      - name: Generate merged release manifest
        run: cd android && ./gradlew :app:processReleaseMainManifest --no-daemon
      - name: Audit release permissions
        run: |
          MANIFEST=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml -type f | grep -E 'merged_manifest|merged_manifests|packaged_manifests' | head -1)
          if [ -z "$MANIFEST" ]; then
            echo 'Merged release manifest not found'
            find android/app/build/intermediates -name AndroidManifest.xml -type f -print
            exit 1
          fi
          echo "MANIFEST=$MANIFEST"
          echo '=== RELEASE USES-PERMISSION ==='
          grep 'uses-permission' "$MANIFEST" || true
          for P in android.permission.SYSTEM_ALERT_WINDOW android.permission.READ_PHONE_STATE android.permission.CAMERA android.permission.RECORD_AUDIO android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION com.google.android.gms.permission.AD_ID; do
            if grep -q "$P" "$MANIFEST"; then
              echo "FORBIDDEN_RELEASE_PERMISSION_PRESENT=$P"
              exit 1
            fi
          done
          echo 'RELEASE_SENSITIVE_PERMISSIONS_CLEAN'
