name: Guarded Website Builder output split

on:
  push:
    branches:
      - refactor/website-builder-split-20260916
    paths:
      - .github/workflows/refactor-builder-output.yml

permissions:
  contents: write

jobs:
  extract-builder-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/website-builder-split-20260916
          fetch-depth: 0

      - name: Extract website output helpers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('src/modules/website-builder/WebsiteBuilderTool.tsx')
          module_path = Path('src/modules/website-builder/core/website-builder-output.ts')
          smoke_path = Path('scripts/website-builder-smoke.mjs')
          text = source_path.read_text(encoding='utf-8')

          start_marker = '  function getHtml(\n'
          end_marker = '  function exportProjectBackup() {'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('Output helper markers are not unique; refusing.')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end].rstrip() + '\n\n'
          if not 5500 <= len(block) <= 18000:
              raise SystemExit(f'Output block size unexpected ({len(block)} bytes); refusing.')
          for required in [
              'function getHtml(',
              'function get404Html(',
              'const canonicalUrl =',
              'const alternateLinks =',
              "createSection('hero')",
              'return buildFullHtml(pageSections, {',
              "currentPageId: '__404__'",
          ]:
              if required not in block:
                  raise SystemExit(f'Expected output behavior missing: {required}')
          for forbidden in ['setPages(', 'setSections(', 'setSaved(', 'setPublishedUrl(', 'await ', 'useState(', 'useEffect(']:
              if forbidden in block:
                  raise SystemExit(f'Stateful/async behavior found in output block ({forbidden}); refusing.')

          module_text = """import type { Language } from '@/context/PreferencesContext';
import { createSection } from './defaults';
import { normalizePageLanguage, normalizeSlug } from './project-identifiers';
import type { WebsiteSEO, WebsiteSection } from './types';
import type {
  WebsiteFooterConfig,
  WebsiteHeaderConfig,
  WebsitePage,
  WebsiteProductionConfig,
  WebsiteSiteEnhancements,
  WebsiteTheme,
} from './website-builder-model';
import { buildFullHtml, normalizeSiteUrl } from './website-builder-rendering';

export interface WebsiteBuilderOutputContext {
  pages: WebsitePage[];
  sections: WebsiteSection[];
  activePageId: string;
  homePageId: string;
  siteUrl: string;
  siteName: string;
  faviconUrl: string;
  seo: WebsiteSEO;
  theme: WebsiteTheme;
  headerConfig: WebsiteHeaderConfig;
  footerConfig: WebsiteFooterConfig;
  siteEnhancements: WebsiteSiteEnhancements;
  productionConfig: WebsiteProductionConfig;
  preferredLanguage: Language;
  cloudProjectId: string | null;
  supabaseUrl: string;
  supabaseAnonKey: string;
}

export function buildWebsitePageHtml(
  context: WebsiteBuilderOutputContext,
  pageSections: WebsiteSection[],
  pageId: string,
  productionUrlOverride?: string,
  homeUsesIndexFile = false,
  trackAnalytics = false,
) {
  const currentPages = context.pages.map((page) => page.id === context.activePageId
    ? { ...page, sections: context.sections }
    : page);
  const page = currentPages.find((item) => item.id === pageId) || currentPages[0];
  const productionUrl = normalizeSiteUrl(productionUrlOverride ?? context.siteUrl);
  const filename = page?.id === context.homePageId ? 'index.html' : `${normalizeSlug(page?.slug || 'page')}.html`;
  const canonicalOverride = page?.canonicalUrl?.trim() ? normalizeSiteUrl(page.canonicalUrl) : '';
  const canonicalUrl = canonicalOverride || (productionUrl
    ? page?.id === context.homePageId
      ? homeUsesIndexFile ? `${productionUrl}/index.html` : `${productionUrl}/`
      : `${productionUrl}/${filename}`
    : '');
  const baseTitle = context.seo.title.trim() || context.siteName;
  const defaultPageTitle = page?.id === context.homePageId ? baseTitle : `${page?.name || 'Page'} | ${baseTitle}`;
  const pageTitle = page?.seoTitle?.trim() || defaultPageTitle;
  const pageDescription = page?.seoDescription?.trim() || context.seo.description.trim();
  const pageLanguage = normalizePageLanguage(page?.language, context.preferredLanguage);
  const translationKey = page?.translationKey?.trim();
  const translationPages = translationKey
    ? currentPages.filter((item) => item.translationKey?.trim() === translationKey)
    : [];
  const alternateLinks = productionUrl && translationPages.length > 1
    ? translationPages.map((item, index) => ({
        language: normalizePageLanguage(item.language, context.preferredLanguage),
        href: item.id === context.homePageId
          ? homeUsesIndexFile ? `${productionUrl}/index.html` : `${productionUrl}/`
          : `${productionUrl}/${normalizeSlug(item.slug)}.html`,
        isDefault: index === 0,
      }))
    : [];

  return buildFullHtml(pageSections, {
    language: pageLanguage,
    title: pageTitle,
    description: pageDescription,
    keywords: context.seo.keywords,
    canonicalUrl,
    faviconUrl: context.faviconUrl.trim(),
    socialImageUrl: page?.socialImage?.trim() || '',
    noIndex: page?.noIndex === true,
    alternateLinks,
    theme: context.theme,
    headerConfig: context.headerConfig,
    footerConfig: context.footerConfig,
    siteEnhancements: context.siteEnhancements,
    productionConfig: context.productionConfig,
    pages: currentPages,
    homePageId: context.homePageId,
    currentPageId: pageId,
    siteName: context.siteName,
    leadProjectId: trackAnalytics ? context.cloudProjectId : null,
    analyticsProjectId: context.cloudProjectId,
    analyticsEnabled: trackAnalytics,
    supabaseUrl: context.supabaseUrl,
    supabaseAnonKey: context.supabaseAnonKey,
  });
}

export function buildWebsite404Html(
  context: WebsiteBuilderOutputContext,
  productionUrlOverride?: string,
  homeUsesIndexFile = false,
  trackAnalytics = false,
) {
  const productionUrl = normalizeSiteUrl(productionUrlOverride ?? context.siteUrl);
  const homeHref = productionUrl
    ? homeUsesIndexFile ? `${productionUrl}/index.html` : `${productionUrl}/`
    : 'index.html';
  const notFoundSection = createSection('hero');
  notFoundSection.title = 'Page not found';
  notFoundSection.description = 'The page you are looking for does not exist or may have moved.';
  notFoundSection.buttonText = 'Back to Home';
  notFoundSection.buttonUrl = homeHref;
  notFoundSection.elements = notFoundSection.elements.map((element) => {
    if (element.type === 'heading') return { ...element, content: '404 — Page not found' };
    if (element.type === 'text') return { ...element, content: 'The page you are looking for does not exist or may have moved.' };
    if (element.type === 'button') return { ...element, content: 'Back to Home', href: homeHref };
    return element;
  });
  const currentPages = context.pages.map((page) => page.id === context.activePageId
    ? { ...page, sections: context.sections }
    : page);
  const homeLanguage = normalizePageLanguage(
    currentPages.find((page) => page.id === context.homePageId)?.language,
    context.preferredLanguage,
  );
  return buildFullHtml([notFoundSection], {
    language: homeLanguage,
    title: `404 | ${context.seo.title.trim() || context.siteName}`,
    description: 'Page not found.',
    keywords: [],
    faviconUrl: context.faviconUrl.trim(),
    noIndex: true,
    theme: context.theme,
    headerConfig: context.headerConfig,
    footerConfig: context.footerConfig,
    siteEnhancements: context.siteEnhancements,
    productionConfig: context.productionConfig,
    pages: currentPages,
    homePageId: context.homePageId,
    currentPageId: '__404__',
    siteName: context.siteName,
    analyticsProjectId: context.cloudProjectId,
    analyticsEnabled: trackAnalytics,
    supabaseUrl: context.supabaseUrl,
    supabaseAnonKey: context.supabaseAnonKey,
  });
}
"""

          wrapper = """  function websiteOutputContext() {
    return {
      pages,
      sections,
      activePageId,
      homePageId,
      siteUrl,
      siteName,
      faviconUrl,
      seo,
      theme,
      headerConfig,
      footerConfig,
      siteEnhancements,
      productionConfig: effectiveProductionConfig(),
      preferredLanguage: prefs.language,
      cloudProjectId,
      supabaseUrl: import.meta.env.VITE_SUPABASE_URL || '',
      supabaseAnonKey: import.meta.env.VITE_SUPABASE_ANON_KEY || '',
    };
  }

  function getHtml(
    pageSections: WebsiteSection[] = sections,
    pageId = activePageId,
    productionUrlOverride?: string,
    homeUsesIndexFile = false,
    trackAnalytics = false,
  ) {
    return buildWebsitePageHtml(
      websiteOutputContext(),
      pageSections,
      pageId,
      productionUrlOverride,
      homeUsesIndexFile,
      trackAnalytics,
    );
  }

  function get404Html(productionUrlOverride?: string, homeUsesIndexFile = false, trackAnalytics = false) {
    return buildWebsite404Html(
      websiteOutputContext(),
      productionUrlOverride,
      homeUsesIndexFile,
      trackAnalytics,
    );
  }

"""

          remainder = text[:start] + wrapper + text[end:]
          if 'const canonicalUrl =' in remainder[start:start + len(wrapper) + 200]:
              raise SystemExit('Old output implementation remained in wrapper region; refusing.')
          if len(remainder) >= len(text) - 2500:
              raise SystemExit('WebsiteBuilderTool.tsx did not shrink enough; refusing.')

          import_anchor = "import { buildAIEditableSnapshotData } from './core/editor-ai-editable-snapshot';\n"
          if remainder.count(import_anchor) != 1:
              raise SystemExit('AI editable snapshot import anchor changed; refusing.')
          remainder = remainder.replace(
              import_anchor,
              import_anchor + "import { buildWebsite404Html, buildWebsitePageHtml } from './core/website-builder-output';\n",
              1,
          )

          smoke = smoke_path.read_text(encoding='utf-8')
          path_anchor = "const editorAIEditableSnapshotPath = resolve(root, 'src/modules/website-builder/core/editor-ai-editable-snapshot.ts');\n"
          if smoke.count(path_anchor) != 1:
              raise SystemExit('Smoke AI snapshot path anchor changed; refusing.')
          smoke = smoke.replace(
              path_anchor,
              path_anchor + "const websiteBuilderOutputPath = resolve(root, 'src/modules/website-builder/core/website-builder-output.ts');\n",
              1,
          )

          existence_anchor = "  ['AI editable snapshot helper exists', editorAIEditableSnapshotPath],\n"
          if smoke.count(existence_anchor) != 1:
              raise SystemExit('Smoke AI snapshot existence anchor changed; refusing.')
          smoke = smoke.replace(
              existence_anchor,
              existence_anchor + "  ['Website Builder output helper exists', websiteBuilderOutputPath],\n",
              1,
          )

          read_anchor = "const editorAIEditableSnapshot = existsSync(editorAIEditableSnapshotPath) ? readFileSync(editorAIEditableSnapshotPath, 'utf8') : '';\n"
          if smoke.count(read_anchor) != 1:
              raise SystemExit('Smoke AI snapshot read anchor changed; refusing.')
          smoke = smoke.replace(
              read_anchor,
              read_anchor + "const websiteBuilderOutput = existsSync(websiteBuilderOutputPath) ? readFileSync(websiteBuilderOutputPath, 'utf8') : '';\n",
              1,
          )

          composite_old = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}\\n${editorAIReviewTargets}\\n${websiteBuilderModel}\\n${websiteBuilderConfig}\\n${websiteBuilderRendering}\\n${builderElementPreview}\\n${builderSectionPreview}\\n${editorAIEditableSnapshot}`;\n"
          composite_new = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}\\n${editorAIReviewTargets}\\n${websiteBuilderModel}\\n${websiteBuilderConfig}\\n${websiteBuilderRendering}\\n${builderElementPreview}\\n${builderSectionPreview}\\n${editorAIEditableSnapshot}\\n${websiteBuilderOutput}`;\n"
          if smoke.count(composite_old) != 1:
              raise SystemExit('Smoke logical builder anchor changed; refusing.')
          smoke = smoke.replace(composite_old, composite_new, 1)

          module_path.write_text(module_text, encoding='utf-8')
          source_path.write_text(remainder, encoding='utf-8')
          smoke_path.write_text(smoke, encoding='utf-8')

          print(f'Output block replaced: {len(block)} bytes')
          print(f'WebsiteBuilderTool.tsx: {len(text)} -> {len(remainder)} bytes')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Website Builder smoke
        run: npm run smoke:website-builder

      - name: Commit verified extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/website-builder/WebsiteBuilderTool.tsx src/modules/website-builder/core/website-builder-output.ts scripts/website-builder-smoke.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "[refactor-bot] Extract Website Builder output helpers"
          git push origin HEAD:refactor/website-builder-split-20260916
