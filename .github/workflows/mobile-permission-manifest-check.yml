name: Mobile Permission Manifest Check

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/mobile-permission-manifest-check.yml'

permissions:
  contents: read

jobs:
  android-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean
      - name: Merge Android manifest
        run: cd android && ./gradlew :app:processDebugMainManifest --no-daemon
      - name: Verify camera and microphone are absent from merged manifest
        shell: bash
        run: |
          manifest="$(find android/app/build/intermediates -type f -name AndroidManifest.xml | grep -E '/merged_manifest(s)?/debug/' | head -n 1)"
          test -n "$manifest"
          echo "Merged manifest: $manifest"
          echo '=== final permission declarations ==='
          grep -n 'uses-permission' "$manifest" || true
          if grep -q 'android.permission.CAMERA' "$manifest"; then
            echo 'Unexpected CAMERA permission in merged manifest' >&2
            exit 1
          fi
          if grep -q 'android.permission.RECORD_AUDIO' "$manifest"; then
            echo 'Unexpected RECORD_AUDIO permission in merged manifest' >&2
            exit 1
          fi
