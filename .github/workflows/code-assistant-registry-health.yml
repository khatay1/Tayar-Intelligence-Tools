name: Coding Assistance Registry Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches:
      - 'internal-code-assistant-registry-*'
    paths:
      - 'src/modules/code-assistant/upstream-registry.ts'
      - 'src/modules/code-assistant/source-catalog.ts'
      - 'src/modules/code-assistant/catalogs/**'
      - 'scripts/code-assistant-registry-health.mjs'

permissions:
  contents: read

jobs:
  registry-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run health:code-assistant-registry
