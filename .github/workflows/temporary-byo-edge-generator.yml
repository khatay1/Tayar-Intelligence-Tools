name: Temporary BYO Edge Generator

on:
  push:
    branches:
      - feature/byo-publish-supabase-edge-20261004

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/byo-publish-supabase-edge-20261004
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-website-owned-application-runtime-template.mjs
      - run: node scripts/build-website-byo-publish-function.mjs
      - name: Commit generated Edge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/generated/website-owned-application-runtime-template.ts supabase/functions/website-byo-publish/index.ts
          if git diff --cached --quiet; then
            echo "Generated Edge already current"
            exit 0
          fi
          git commit -m "build: generate BYO publish Supabase Edge"
          git push origin HEAD:feature/byo-publish-supabase-edge-20261004
