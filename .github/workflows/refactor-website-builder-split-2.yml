name: Guarded Website Builder split 2

on:
  push:
    branches:
      - refactor/website-builder-split-20260916
    paths:
      - .github/workflows/refactor-website-builder-split-2.yml

permissions:
  contents: write

jobs:
  extract-ai-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/website-builder-split-20260916
          fetch-depth: 0

      - name: Extract AI edit scope contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/modules/website-builder/WebsiteBuilderTool.tsx')
          module_path = Path('src/modules/website-builder/core/editor-ai-scope.ts')
          smoke_path = Path('scripts/website-builder-smoke.mjs')
          text = source_path.read_text(encoding='utf-8')

          start_marker = 'interface AIEditScopeTarget {'
          end_marker = 'interface WebsitePage {'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('AI scope markers are not unique; refusing to modify source.')

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end].rstrip() + '\n'
          if not 3000 <= len(block) <= 9000:
              raise SystemExit(f'AI scope block size unexpected ({len(block)} bytes); refusing.')

          block = block.replace('pages: WebsitePage[],', 'pages: AIEditScopePage[],')
          module_header = """import type { WebsiteSection } from './types';
import { normalizeSlug } from './project-identifiers';
import type { AIWebsitePatchOperation } from './editor-ai-patch-review';

export interface AIEditScopePage {
  id: string;
  slug: string;
  sections: WebsiteSection[];
}

"""
          exported_block = re.sub(r'(?m)^(interface|type|function|const) ', r'export \1 ', block)
          module_text = module_header + exported_block

          symbol_names = [
              'AIEditScopeTarget', 'aiOperationMatchesEditScope',
              'AIWebsiteAgentReviewFinding', 'AIWebsiteAgentReview', 'AIWebsitePatch',
              'AIBuilderStage', 'AIEditScope', 'AIBuilderMessage',
              'buildAIConversationContext', 'AI_BUILDER_STAGE_ORDER',
          ]
          type_symbols = {
              'AIEditScopeTarget', 'AIWebsiteAgentReviewFinding', 'AIWebsiteAgentReview',
              'AIWebsitePatch', 'AIBuilderStage', 'AIEditScope', 'AIBuilderMessage',
          }

          remainder = text[:start] + text[end:]
          used = [name for name in symbol_names if re.search(rf'\b{re.escape(name)}\b', remainder)]
          if len(used) < 6:
              raise SystemExit(f'Too few AI scope exports remain referenced ({used}); refusing.')

          import_lines = ['import {']
          for name in used:
              import_lines.append(f"  {'type ' if name in type_symbols else ''}{name},")
          import_lines.append("} from './core/editor-ai-scope';")
          import_text = '\n'.join(import_lines) + '\n'

          anchor = "} from './core/editor-ai-patch-review';\n"
          if remainder.count(anchor) != 1:
              raise SystemExit('AI patch review import anchor changed; refusing.')
          remainder = remainder.replace(anchor, anchor + import_text, 1)

          if start_marker in remainder:
              raise SystemExit('AI scope block still present after extraction.')
          if len(remainder) >= len(text) - 2500:
              raise SystemExit('WebsiteBuilderTool.tsx did not shrink enough; refusing.')

          smoke = smoke_path.read_text(encoding='utf-8')
          path_anchor = "const editorAIPatchReviewPath = resolve(root, 'src/modules/website-builder/core/editor-ai-patch-review.ts');\n"
          if smoke.count(path_anchor) != 1:
              raise SystemExit('Smoke AI patch path anchor changed; refusing.')
          smoke = smoke.replace(
              path_anchor,
              path_anchor + "const editorAIScopePath = resolve(root, 'src/modules/website-builder/core/editor-ai-scope.ts');\n",
              1,
          )
          existence_anchor = "  ['AI patch review module exists', editorAIPatchReviewPath],\n"
          if smoke.count(existence_anchor) != 1:
              raise SystemExit('Smoke AI patch existence anchor changed; refusing.')
          smoke = smoke.replace(
              existence_anchor,
              existence_anchor + "  ['AI edit scope module exists', editorAIScopePath],\n",
              1,
          )
          read_anchor = "const editorAIPatchReview = existsSync(editorAIPatchReviewPath) ? readFileSync(editorAIPatchReviewPath, 'utf8') : '';\n"
          if smoke.count(read_anchor) != 1:
              raise SystemExit('Smoke AI patch read anchor changed; refusing.')
          smoke = smoke.replace(
              read_anchor,
              read_anchor + "const editorAIScope = existsSync(editorAIScopePath) ? readFileSync(editorAIScopePath, 'utf8') : '';\n",
              1,
          )
          composite_old = "const builder = `${builderSource}\\n${editorAIPatchReview}`;\n"
          composite_new = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}`;\n"
          if smoke.count(composite_old) != 1:
              raise SystemExit('Smoke logical builder source anchor changed; refusing.')
          smoke = smoke.replace(composite_old, composite_new, 1)

          source_path.write_text(remainder, encoding='utf-8')
          module_path.write_text(module_text, encoding='utf-8')
          smoke_path.write_text(smoke, encoding='utf-8')

          print(f'AI scope extracted: {len(block)} bytes')
          print(f'WebsiteBuilderTool.tsx: {len(text)} -> {len(remainder)} bytes')
          print('Re-imported symbols:', ', '.join(used))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Website Builder smoke
        run: npm run smoke:website-builder

      - name: Commit verified extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/website-builder/WebsiteBuilderTool.tsx src/modules/website-builder/core/editor-ai-scope.ts scripts/website-builder-smoke.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "[refactor-bot] Extract AI edit scope contracts"
          git push origin HEAD:refactor/website-builder-split-20260916
