name: Temporary BYO Bundle Regeneration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/regenerate-byo-bundle.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build-website-byo-publish-function.mjs
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- supabase/functions/website-byo-publish/index.ts; then
            echo "Bundle already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/website-byo-publish/index.ts
          git commit -m "build: regenerate BYO publish bundle"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: website-byo-publish-generated
          path: supabase/functions/website-byo-publish/index.ts
          if-no-files-found: error
          retention-days: 1
