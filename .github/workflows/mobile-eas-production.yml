name: Tayar Mobile EAS Production Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/mobile-eas-production.yml'

permissions:
  contents: read

env:
  EAS_PLATFORM: ios

concurrency:
  group: tayar-mobile-eas-production-${{ github.ref }}-ios
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Verify EAS release prerequisites
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is required before starting a signed EAS build."
            exit 1
          fi
          node - <<'NODE'
          const app = require('./app.json');
          const projectId = app.expo?.extra?.eas?.projectId;
          if (typeof projectId !== 'string' || !projectId.trim()) {
            throw new Error('expo.extra.eas.projectId is missing. Run the Tayar Mobile EAS Bootstrap workflow first.');
          }
          console.log(`Using EAS project ${projectId}.`);
          NODE

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare pinned mobile models
        run: npm run models:prepare

      - name: Verify Expo account and project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@23.2.0 whoami
          npx --yes eas-cli@23.2.0 project:info
          npx --yes eas-cli@23.2.0 config --platform "$EAS_PLATFORM" --profile production --json --non-interactive >/dev/null

      - name: Queue signed production build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@23.2.0 build \
            --platform "$EAS_PLATFORM" \
            --profile production \
            --non-interactive \
            --no-wait
