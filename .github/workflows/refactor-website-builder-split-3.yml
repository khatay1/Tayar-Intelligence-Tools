name: Guarded Website Builder split 3

on:
  push:
    branches:
      - refactor/website-builder-split-20260916
    paths:
      - .github/workflows/refactor-website-builder-split-3.yml

permissions:
  contents: write

jobs:
  extract-ai-review-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/website-builder-split-20260916
          fetch-depth: 0

      - name: Extract AI review target helpers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/modules/website-builder/WebsiteBuilderTool.tsx')
          module_path = Path('src/modules/website-builder/core/editor-ai-review-targets.ts')
          smoke_path = Path('scripts/website-builder-smoke.mjs')
          text = source_path.read_text(encoding='utf-8')

          start_marker = 'function aiWebsitePatchReviewItemIsGlobal('
          end_marker = 'interface AIWebsiteUndoSnapshot {'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('AI review target markers are not unique; refusing.')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end].rstrip() + '\n'
          if not 4500 <= len(block) <= 12000:
              raise SystemExit(f'AI review target block size unexpected ({len(block)} bytes); refusing.')

          block = block.replace(
              'function aiWebsitePatchReviewItemTargetPage(\n  operation: AIWebsitePatchReviewItem,\n  pages: WebsitePage[],\n): WebsitePage | undefined {',
              'function aiWebsitePatchReviewItemTargetPage<T extends AIWebsiteReviewPage>(\n  operation: AIWebsitePatchReviewItem,\n  pages: T[],\n): T | undefined {',
          )
          block = block.replace('page: WebsitePage,', 'page: AIWebsiteReviewPage,')
          block = block.replace('baselinePages: WebsitePage[],', 'baselinePages: AIWebsiteReviewPage[],')
          block = block.replace('candidatePages: WebsitePage[],', 'candidatePages: AIWebsiteReviewPage[],')
          if 'WebsitePage' in block:
              raise SystemExit('WebsitePage dependency remained in extracted block; refusing.')

          module_header = (
              "import type { WebsiteSection } from './types';\n"
              "import { normalizeSlug } from './project-identifiers';\n"
              "import type { AIWebsitePatchReview, AIWebsitePatchReviewItem } from './editor-ai-patch-review';\n\n"
              "export interface AIWebsiteReviewPage {\n"
              "  id: string;\n"
              "  slug: string;\n"
              "  sections: WebsiteSection[];\n"
              "}\n\n"
          )
          exported = re.sub(r'(?m)^function ', 'export function ', block)
          module_text = module_header + exported

          symbols = [
              'aiWebsitePatchReviewItemIsGlobal',
              'aiWebsitePatchReviewItemTargetsPage',
              'aiWebsitePatchReviewItemTargetPage',
              'reconcileAIWebsitePatchReviewTargets',
          ]
          remainder = text[:start] + text[end:]
          used = [name for name in symbols if re.search(rf'\b{re.escape(name)}\b', remainder)]
          if len(used) < 3:
              raise SystemExit(f'Too few review target helpers remain referenced ({used}); refusing.')

          import_text = "import {\n" + ''.join(f'  {name},\n' for name in used) + "} from './core/editor-ai-review-targets';\n"
          anchor = "} from './core/editor-ai-scope';\n"
          if remainder.count(anchor) != 1:
              raise SystemExit('AI scope import anchor changed; refusing.')
          remainder = remainder.replace(anchor, anchor + import_text, 1)
          if start_marker in remainder:
              raise SystemExit('AI review target block remained after extraction.')
          if len(remainder) >= len(text) - 4000:
              raise SystemExit('WebsiteBuilderTool.tsx did not shrink enough; refusing.')

          smoke = smoke_path.read_text(encoding='utf-8')
          path_anchor = "const editorAIScopePath = resolve(root, 'src/modules/website-builder/core/editor-ai-scope.ts');\n"
          if smoke.count(path_anchor) != 1:
              raise SystemExit('Smoke AI scope path anchor changed; refusing.')
          smoke = smoke.replace(
              path_anchor,
              path_anchor + "const editorAIReviewTargetsPath = resolve(root, 'src/modules/website-builder/core/editor-ai-review-targets.ts');\n",
              1,
          )
          existence_anchor = "  ['AI edit scope module exists', editorAIScopePath],\n"
          if smoke.count(existence_anchor) != 1:
              raise SystemExit('Smoke AI scope existence anchor changed; refusing.')
          smoke = smoke.replace(
              existence_anchor,
              existence_anchor + "  ['AI review target module exists', editorAIReviewTargetsPath],\n",
              1,
          )
          read_anchor = "const editorAIScope = existsSync(editorAIScopePath) ? readFileSync(editorAIScopePath, 'utf8') : '';\n"
          if smoke.count(read_anchor) != 1:
              raise SystemExit('Smoke AI scope read anchor changed; refusing.')
          smoke = smoke.replace(
              read_anchor,
              read_anchor + "const editorAIReviewTargets = existsSync(editorAIReviewTargetsPath) ? readFileSync(editorAIReviewTargetsPath, 'utf8') : '';\n",
              1,
          )
          old = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}`;\n"
          new = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}\\n${editorAIReviewTargets}`;\n"
          if smoke.count(old) != 1:
              raise SystemExit('Smoke composite source anchor changed; refusing.')
          smoke = smoke.replace(old, new, 1)

          source_path.write_text(remainder, encoding='utf-8')
          module_path.write_text(module_text, encoding='utf-8')
          smoke_path.write_text(smoke, encoding='utf-8')
          print(f'AI review targets extracted: {len(block)} bytes')
          print(f'WebsiteBuilderTool.tsx: {len(text)} -> {len(remainder)} bytes')
          print('Re-imported helpers:', ', '.join(used))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Website Builder smoke
        run: npm run smoke:website-builder

      - name: Commit verified extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/website-builder/WebsiteBuilderTool.tsx src/modules/website-builder/core/editor-ai-review-targets.ts scripts/website-builder-smoke.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "[refactor-bot] Extract AI review target helpers"
          git push origin HEAD:refactor/website-builder-split-20260916
