name: Guarded SectionPreview split

on:
  push:
    branches:
      - refactor/website-builder-split-20260916
    paths:
      - .github/workflows/refactor-builder-section-preview.yml

permissions:
  contents: write

jobs:
  extract-section-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/website-builder-split-20260916
          fetch-depth: 0

      - name: Extract SectionPreview component
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          source_path = Path('src/modules/website-builder/WebsiteBuilderTool.tsx')
          module_path = Path('src/modules/website-builder/components/SectionPreview.tsx')
          smoke_path = Path('scripts/website-builder-smoke.mjs')
          text = source_path.read_text(encoding='utf-8')

          start_marker = 'function SectionPreview('
          end_marker = 'export default function WebsiteBuilderTool('
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('SectionPreview markers are not unique; refusing.')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end].rstrip() + '\n'
          if not 25000 <= len(block) <= 100000:
              raise SystemExit(f'SectionPreview block size unexpected ({len(block)} bytes); refusing.')
          if 'export default function WebsiteBuilderTool(' in block:
              raise SystemExit('WebsiteBuilderTool leaked into SectionPreview extraction; refusing.')
          for required in [
              'const [marqueeRect, setMarqueeRect] = useState',
              'const beginMarqueeSelection =',
              'const renderSelectedElementResizeHandle =',
              '<ElementPreview',
              "section.type === 'contact'",
          ]:
              if required not in block:
                  raise SystemExit(f'Expected SectionPreview behavior missing: {required}')

          groups = [
              ('react', False, ['useEffect', 'useRef', 'useState']),
              ('@/lib/ui-localization', False, ['useLocalizer']),
              ('lucide-react', False, [
                  'Plus', 'Trash2', 'ChevronUp', 'ChevronDown', 'ChevronLeft', 'ChevronRight',
                  'Monitor', 'Smartphone', 'Save', 'RotateCcw', 'Type', 'Palette', 'Eye',
                  'Sparkles', 'Download', 'Copy', 'ExternalLink', 'Link', 'Globe', 'Check',
                  'MousePointer2', 'HistoryIcon', 'Inbox', 'BarChart3', 'Images', 'Upload',
              ]),
              ('../core/types', True, [
                  'Device', 'WebsiteElement', 'WebsiteElementContainer', 'WebsiteElementType',
                  'WebsiteFormField', 'WebsiteSection',
              ]),
              ('../core/defaults', False, [
                  'ELEMENT_LABELS', 'SECTION_LABELS', 'createDefaultContactFormFields',
              ]),
              ('../core/editor-canvas-geometry', False, [
                  'CANVAS_GRID_SIZE', 'CANVAS_RESIZE_SNAP_STEP', 'resolveCanvasResize',
              ]),
              ('../core/editor-canvas-geometry', True, ['CanvasSnapGuides']),
              ('../core/editor-ai-patch-review', False, ['aiWebsitePatchPreviewClass']),
              ('../core/editor-ai-patch-review', True, ['AIWebsiteCanvasPreview']),
              ('../core/website-builder-model', True, ['WebsiteTheme']),
              ('../core/website-builder-rendering', False, [
                  'sectionColumnCount', 'sectionLayoutGap', 'sectionLayoutAlign',
                  'sectionBackgroundMode', 'sectionBackgroundPosition', 'sectionBackgroundSize',
                  'sectionContentWidth', 'sectionVisualNumber', 'safeSectionColor',
                  'sectionBackgroundCss', 'sectionDomId', 'effectiveStyle', 'effectiveSectionStyle',
                  'clampElementNumber', 'elementColumn', 'elementColumnSpan', 'elementShadowCss',
                  'containerColumn', 'containerColumnSpan',
              ]),
              ('./ElementPreview', False, ['ElementPreview']),
          ]

          imports = []
          for module, type_only, names in groups:
              used = [name for name in names if re.search(rf'\b{re.escape(name)}\b', block)]
              if not used:
                  continue
              prefix = 'import type' if type_only else 'import'
              imports.append(f"{prefix} {{ {', '.join(used)} }} from '{module}';")
          module_text = '\n'.join(imports) + '\n\n' + block.replace('function SectionPreview(', 'export function SectionPreview(', 1)

          remainder = text[:start] + text[end:]
          if start_marker in remainder:
              raise SystemExit('SectionPreview remained after extraction.')
          if len(remainder) >= len(text) - 24000:
              raise SystemExit('WebsiteBuilderTool.tsx did not shrink enough; refusing.')

          element_import = "import { ElementPreview } from './components/ElementPreview';\n"
          if remainder.count(element_import) != 1:
              raise SystemExit('ElementPreview import anchor missing or duplicated; refusing.')
          remainder = remainder.replace(element_import, "import { SectionPreview } from './components/SectionPreview';\n", 1)

          candidates = [
              'CANVAS_RESIZE_SNAP_STEP', 'resolveCanvasResize', 'aiWebsitePatchPreviewClass',
              'sectionColumnCount', 'sectionLayoutGap', 'sectionLayoutAlign', 'sectionBackgroundMode',
              'sectionBackgroundPosition', 'sectionBackgroundSize', 'sectionContentWidth',
              'sectionVisualNumber', 'safeSectionColor', 'sectionBackgroundCss', 'sectionDomId',
              'effectiveSectionStyle', 'elementColumn', 'elementShadowCss',
              'containerColumn', 'containerColumnSpan',
          ]
          for name in candidates:
              if len(re.findall(rf'\b{re.escape(name)}\b', remainder)) == 1:
                  pattern = re.compile(rf'^\s*{re.escape(name)},\n', re.MULTILINE)
                  remainder, count = pattern.subn('', remainder, count=1)
                  if count != 1:
                      raise SystemExit(f'Expected import line missing for cleanup: {name}')

          # These three are compiler-confirmed stale imports. Remove only their exact import lines.
          for name in ['MousePointer2', 'CANVAS_GRID_SIZE', 'elementColumnSpan']:
              line = f'  {name},\n'
              if remainder.count(line) != 1:
                  raise SystemExit(f'Expected stale import line missing or duplicated: {name}')
              remainder = remainder.replace(line, '', 1)

          smoke = smoke_path.read_text(encoding='utf-8')
          path_anchor = "const builderElementPreviewPath = resolve(root, 'src/modules/website-builder/components/ElementPreview.tsx');\n"
          if smoke.count(path_anchor) != 1:
              raise SystemExit('Smoke ElementPreview path anchor changed; refusing.')
          smoke = smoke.replace(
              path_anchor,
              path_anchor + "const builderSectionPreviewPath = resolve(root, 'src/modules/website-builder/components/SectionPreview.tsx');\n",
              1,
          )

          existence_anchor = "  ['ElementPreview component exists', builderElementPreviewPath],\n"
          if smoke.count(existence_anchor) != 1:
              raise SystemExit('Smoke ElementPreview existence anchor changed; refusing.')
          smoke = smoke.replace(
              existence_anchor,
              existence_anchor + "  ['SectionPreview component exists', builderSectionPreviewPath],\n",
              1,
          )

          read_anchor = "const builderElementPreview = existsSync(builderElementPreviewPath) ? readFileSync(builderElementPreviewPath, 'utf8') : '';\n"
          if smoke.count(read_anchor) != 1:
              raise SystemExit('Smoke ElementPreview read anchor changed; refusing.')
          smoke = smoke.replace(
              read_anchor,
              read_anchor + "const builderSectionPreview = existsSync(builderSectionPreviewPath) ? readFileSync(builderSectionPreviewPath, 'utf8') : '';\n",
              1,
          )

          composite_old = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}\\n${editorAIReviewTargets}\\n${websiteBuilderModel}\\n${websiteBuilderConfig}\\n${websiteBuilderRendering}\\n${builderElementPreview}`;\n"
          composite_new = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}\\n${editorAIReviewTargets}\\n${websiteBuilderModel}\\n${websiteBuilderConfig}\\n${websiteBuilderRendering}\\n${builderElementPreview}\\n${builderSectionPreview}`;\n"
          if smoke.count(composite_old) != 1:
              raise SystemExit('Smoke logical builder anchor changed; refusing.')
          smoke = smoke.replace(composite_old, composite_new, 1)

          module_path.write_text(module_text, encoding='utf-8')
          source_path.write_text(remainder, encoding='utf-8')
          smoke_path.write_text(smoke, encoding='utf-8')

          print(f'SectionPreview extracted: {len(block)} bytes')
          print(f'WebsiteBuilderTool.tsx: {len(text)} -> {len(remainder)} bytes')
          print('Imports:', *imports, sep='\n  ')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Website Builder smoke
        run: npm run smoke:website-builder

      - name: Commit verified extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/website-builder/WebsiteBuilderTool.tsx src/modules/website-builder/components/SectionPreview.tsx scripts/website-builder-smoke.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "[refactor-bot] Extract SectionPreview component"
          git push origin HEAD:refactor/website-builder-split-20260916
