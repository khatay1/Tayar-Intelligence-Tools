name: Temporary Activation Auth Begin Probe
on:
  push:
    branches: [test/activation-auth-begin-probe-20261004]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/temp-activation-auth-begin-probe.mjs
