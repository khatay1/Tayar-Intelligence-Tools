name: Mobile EAS Readiness Check

on:
  push:
    branches:
      - mobile-native-react-native-20260907
    paths:
      - '.github/workflows/mobile-eas-readiness-check.yml'

permissions:
  contents: read

jobs:
  eas-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
      - name: Check Expo authentication
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo 'EXPO_TOKEN_MISSING'
            exit 2
          fi
          npx --yes eas-cli@latest whoami
      - name: Check EAS project link
        run: npx --yes eas-cli@latest project:info --non-interactive
