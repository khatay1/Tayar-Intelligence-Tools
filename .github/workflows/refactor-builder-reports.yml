name: Guarded Website Builder report split

on:
  push:
    branches:
      - refactor/website-builder-split-20260916
    paths:
      - .github/workflows/refactor-builder-reports.yml

permissions:
  contents: write

jobs:
  extract-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/website-builder-split-20260916
          fetch-depth: 0

      - name: Extract pure report generation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source_path = Path('src/modules/website-builder/WebsiteBuilderTool.tsx')
          module_path = Path('src/modules/website-builder/core/website-builder-reports.ts')
          smoke_path = Path('scripts/website-builder-smoke.mjs')
          source = source_path.read_text(encoding='utf-8')
          smoke = smoke_path.read_text(encoding='utf-8')

          def find_function(text, name):
              match = re.search(rf'(?m)^  function\s+{re.escape(name)}\s*\(', text)
              if not match:
                  raise SystemExit(f'Function {name} not found; refusing.')
              brace = text.find('{', match.start())
              depth = 0
              quote = None
              escape = False
              i = brace
              while i < len(text):
                  ch = text[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                      i += 1
                      continue
                  if ch in "'\"`":
                      quote = ch
                  elif ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return match.start(), i + 1, text[match.start():i + 1]
                  i += 1
              raise SystemExit(f'Function {name} did not terminate; refusing.')

          audit_start, audit_end, audit_block = find_function(source, 'exportAuditReport')
          delivery_start, delivery_end, delivery_block = find_function(source, 'buildDeliveryReport')
          launch_start, launch_end, launch_block = find_function(source, 'exportV1LaunchReport')

          expected_sizes = {
              'exportAuditReport': (800, 1100, len(audit_block)),
              'buildDeliveryReport': (1700, 2200, len(delivery_block)),
              'exportV1LaunchReport': (1600, 2100, len(launch_block)),
          }
          for name, (minimum, maximum, actual) in expected_sizes.items():
              if not minimum <= actual <= maximum:
                  raise SystemExit(f'{name} size changed ({actual}); refusing.')

          for block, required in [
              (audit_block, ['Pre-publish Audit', 'qualityDiagnostics.snapshotKb', 'siteAudit.warnings']),
              (delivery_block, ['Client Delivery Report', 'deliveryUsage.analyticsEvents', 'HANDOFF NOTES']),
              (launch_block, ['Final Launch Report', 'Manual production checks', 'v1LaunchStatus.blockers']),
          ]:
              for token in required:
                  if token not in block:
                      raise SystemExit(f'Report behavior token missing: {token}')

          audit_body = textwrap.dedent(audit_block)
          audit_download = "  downloadTextFile(`${normalizeSlug(siteName || 'website')}-audit.txt`, lines.join('\\n'));\n"
          if audit_body.count(audit_download) != 1:
              raise SystemExit('Audit report download line changed; refusing.')
          audit_body = audit_body.replace(audit_download, "  return lines.join('\\n');\n", 1)
          audit_body = audit_body.replace(
              'function exportAuditReport() {',
              '''export function buildAuditReportText({\n  siteName,\n  siteAudit,\n  pageCount,\n  networkOnline,\n  cloudSyncFailed,\n  qualityDiagnostics,\n}: AuditReportContext) {''',
              1,
          ).replace('`Pages: ${pages.length}`', '`Pages: ${pageCount}`')

          delivery_body = textwrap.dedent(delivery_block).replace(
              'function buildDeliveryReport() {',
              '''export function buildDeliveryReportText({\n  deliveryConfig,\n  approvalCurrent,\n  siteName,\n  launchReadiness,\n  siteAudit,\n  publishedUrl,\n  previewUrl,\n  deliveryUsage,\n  localize,\n}: DeliveryReportContext) {''',
              1,
          ).replace('${l(item.label)}', '${localize(item.label)}')

          launch_body = textwrap.dedent(launch_block)
          launch_download = "  downloadTextFile(`${normalizeSlug(siteName || 'website')}-v1-launch-report.txt`, lines.join('\\n'));\n"
          if launch_body.count(launch_download) != 1:
              raise SystemExit('Launch report download line changed; refusing.')
          launch_body = launch_body.replace(launch_download, "  return lines.join('\\n');\n", 1)
          launch_body = launch_body.replace(
              'function exportV1LaunchReport() {',
              '''export function buildV1LaunchReportText({\n  launchManualChecks,\n  siteName,\n  cloudProjectId,\n  planLabel,\n  v1LaunchStatus,\n  siteAudit,\n  productionUrl,\n  publishedUrl,\n  liveVerification,\n  cloudSyncFailed,\n  autoSaveStatus,\n  networkOnline,\n}: V1LaunchReportContext) {''',
              1,
          )
          launch_body = launch_body.replace('BILLING_PLAN_DETAILS[billingPlan].label', 'planLabel')
          launch_body = launch_body.replace("normalizeSiteUrl(siteUrl) || 'Not configured'", "productionUrl || 'Not configured'")

          module_header = '''import type { WebsiteDeliveryConfig } from './delivery-config';\n\ninterface AuditSummary {\n  score: number;\n  errors: string[];\n  warnings: string[];\n}\n\ninterface LaunchReadinessSummary {\n  score: number;\n  checks: Array<{ ok: boolean; label: string }>;\n}\n\ninterface DeliveryUsageSummary {\n  pages: number;\n  sections: number;\n  elements: number;\n  forms: number;\n  releases: number;\n  leads: number;\n  analyticsEvents: number;\n}\n\nexport interface AuditReportContext {\n  siteName: string;\n  siteAudit: AuditSummary;\n  pageCount: number;\n  networkOnline: boolean;\n  cloudSyncFailed: boolean;\n  qualityDiagnostics: { snapshotKb: number; elements: number };\n}\n\nexport interface DeliveryReportContext {\n  deliveryConfig: WebsiteDeliveryConfig;\n  approvalCurrent: boolean;\n  siteName: string;\n  launchReadiness: LaunchReadinessSummary;\n  siteAudit: AuditSummary;\n  publishedUrl: string;\n  previewUrl: string;\n  deliveryUsage: DeliveryUsageSummary;\n  localize: (value: string) => string;\n}\n\nexport interface V1LaunchReportContext {\n  launchManualChecks: { stripe: boolean; domain: boolean; support: boolean };\n  siteName: string;\n  cloudProjectId: string | null;\n  planLabel: string;\n  v1LaunchStatus: {\n    status: string;\n    score: number;\n    checks: Array<{ ok: boolean; label: string; detail: string }>;\n    blockers: string[];\n  };\n  siteAudit: AuditSummary;\n  productionUrl: string;\n  publishedUrl: string;\n  liveVerification: string;\n  cloudSyncFailed: boolean;\n  autoSaveStatus: string;\n  networkOnline: boolean;\n}\n\n'''
          module_text = module_header + audit_body + '\n\n' + delivery_body + '\n\n' + launch_body + '\n'

          wrappers = {
              'exportAuditReport': '''  function exportAuditReport() {\n    const content = buildAuditReportText({\n      siteName,\n      siteAudit,\n      pageCount: pages.length,\n      networkOnline,\n      cloudSyncFailed,\n      qualityDiagnostics,\n    });\n    downloadTextFile(`${normalizeSlug(siteName || 'website')}-audit.txt`, content);\n  }''',
              'buildDeliveryReport': '''  function buildDeliveryReport() {\n    return buildDeliveryReportText({\n      deliveryConfig,\n      approvalCurrent,\n      siteName,\n      launchReadiness,\n      siteAudit,\n      publishedUrl,\n      previewUrl,\n      deliveryUsage,\n      localize: l,\n    });\n  }''',
              'exportV1LaunchReport': '''  function exportV1LaunchReport() {\n    const content = buildV1LaunchReportText({\n      launchManualChecks,\n      siteName,\n      cloudProjectId,\n      planLabel: BILLING_PLAN_DETAILS[billingPlan].label,\n      v1LaunchStatus,\n      siteAudit,\n      productionUrl: normalizeSiteUrl(siteUrl),\n      publishedUrl,\n      liveVerification,\n      cloudSyncFailed,\n      autoSaveStatus,\n      networkOnline,\n    });\n    downloadTextFile(`${normalizeSlug(siteName || 'website')}-v1-launch-report.txt`, content);\n  }''',
          }

          replacements = sorted([
              (audit_start, audit_end, wrappers['exportAuditReport']),
              (delivery_start, delivery_end, wrappers['buildDeliveryReport']),
              (launch_start, launch_end, wrappers['exportV1LaunchReport']),
          ], reverse=True)
          next_source = source
          for start, end, replacement in replacements:
              next_source = next_source[:start] + replacement + next_source[end:]

          import_anchor = "import { createWebsiteBuilderOutput } from './core/website-builder-output';\n"
          if next_source.count(import_anchor) != 1:
              raise SystemExit('Report import anchor changed; refusing.')
          next_source = next_source.replace(
              import_anchor,
              import_anchor + "import { buildAuditReportText, buildDeliveryReportText, buildV1LaunchReportText } from './core/website-builder-reports';\n",
              1,
          )

          for old_token in ['Tayar Website Builder — Pre-publish Audit', 'Tayar Website Builder — Client Delivery Report', 'Tayar Website Builder V1 — Final Launch Report']:
              if old_token in next_source:
                  raise SystemExit(f'Old report implementation remained in main source: {old_token}')
          if len(next_source) >= len(source) - 2000:
              raise SystemExit('WebsiteBuilderTool.tsx did not shrink enough; refusing.')

          smoke_path_anchor = "const websiteBuilderOutputPath = resolve(root, 'src/modules/website-builder/core/website-builder-output.ts');\n"
          if smoke.count(smoke_path_anchor) != 1:
              raise SystemExit('Smoke output path anchor changed; refusing.')
          smoke = smoke.replace(
              smoke_path_anchor,
              smoke_path_anchor + "const websiteBuilderReportsPath = resolve(root, 'src/modules/website-builder/core/website-builder-reports.ts');\n",
              1,
          )
          existence_anchor = "  ['Website Builder output helper exists', websiteBuilderOutputPath],\n"
          if smoke.count(existence_anchor) != 1:
              raise SystemExit('Smoke output existence anchor changed; refusing.')
          smoke = smoke.replace(
              existence_anchor,
              existence_anchor + "  ['Website Builder reports helper exists', websiteBuilderReportsPath],\n",
              1,
          )
          read_anchor = "const websiteBuilderOutput = existsSync(websiteBuilderOutputPath) ? readFileSync(websiteBuilderOutputPath, 'utf8') : '';\n"
          if smoke.count(read_anchor) != 1:
              raise SystemExit('Smoke output read anchor changed; refusing.')
          smoke = smoke.replace(
              read_anchor,
              read_anchor + "const websiteBuilderReports = existsSync(websiteBuilderReportsPath) ? readFileSync(websiteBuilderReportsPath, 'utf8') : '';\n",
              1,
          )
          composite_old = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}\\n${editorAIReviewTargets}\\n${websiteBuilderModel}\\n${websiteBuilderConfig}\\n${websiteBuilderRendering}\\n${builderElementPreview}\\n${builderSectionPreview}\\n${editorAIEditableSnapshot}\\n${websiteBuilderOutput}`;\n"
          composite_new = "const builder = `${builderSource}\\n${editorAIPatchReview}\\n${editorAIScope}\\n${editorAIReviewTargets}\\n${websiteBuilderModel}\\n${websiteBuilderConfig}\\n${websiteBuilderRendering}\\n${builderElementPreview}\\n${builderSectionPreview}\\n${editorAIEditableSnapshot}\\n${websiteBuilderOutput}\\n${websiteBuilderReports}`;\n"
          if smoke.count(composite_old) != 1:
              raise SystemExit('Smoke builder composite anchor changed; refusing.')
          smoke = smoke.replace(composite_old, composite_new, 1)

          module_path.write_text(module_text, encoding='utf-8')
          source_path.write_text(next_source, encoding='utf-8')
          smoke_path.write_text(smoke, encoding='utf-8')
          print(f'Report blocks: audit={len(audit_block)}, delivery={len(delivery_block)}, launch={len(launch_block)}')
          print(f'WebsiteBuilderTool.tsx: {len(source)} -> {len(next_source)} bytes')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Website Builder smoke
        run: npm run smoke:website-builder

      - name: Commit verified extraction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/website-builder/WebsiteBuilderTool.tsx src/modules/website-builder/core/website-builder-reports.ts scripts/website-builder-smoke.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "[refactor-bot] Extract Website Builder reports"
          git push origin HEAD:refactor/website-builder-split-20260916
